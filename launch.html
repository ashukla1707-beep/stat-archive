<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Stat Archive</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #000;
    }
    body, .pwa-splash {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pwa-splash {
      position: fixed;
      inset: 0;
      background: #000;
    }
    .pwa-splash img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      object-position: center center;
      background: #000;
    }
  </style>
</head>
<body>
  <div class="pwa-splash" aria-label="Stat Archive loading">
    <img
      id="pwaSplashImage"
      src="/icons/pwa-splash.webp?v=20260915-approved-v2"
      alt="Stat Archive"
      decoding="async"
      fetchpriority="high"
    />
  </div>
  <script>
    (() => {
      const started = Date.now();
      const minimumVisibleMs = 900;
      let finished = false;
      function enterApp() {
        if (finished) return;
        finished = true;
        const remaining = Math.max(0, minimumVisibleMs - (Date.now() - started));
        setTimeout(() => window.location.replace('/?pwa=1'), remaining);
      }
      const image = document.getElementById('pwaSplashImage');
      if (image.complete) enterApp();
      else {
        image.addEventListener('load', enterApp, { once: true });
        image.addEventListener('error', enterApp, { once: true });
        setTimeout(enterApp, 1800);
      }
    })();
  </script>
</body>
</html>
