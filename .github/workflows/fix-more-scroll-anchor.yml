# Triggered after workflow registration on main.
name: Fix More scroll anchor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-more-scroll-anchor.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smooth More and Show less movement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('assets/js/archive-ui.js')
          s = p.read_text(encoding='utf-8')

          old = '          window.scrollBy({ top: delta, left: 0, behavior: "auto" });'
          good = '''          const motion = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";
          window.scrollBy({ top: delta, left: 0, behavior: motion });'''
          bad_indent = '''          const motion = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";
window.scrollBy({ top: delta, left: 0, behavior: motion });'''

          if old in s:
              s = s.replace(old, good, 1)
          elif bad_indent in s:
              s = s.replace(bad_indent, good, 1)
          elif good not in s:
              raise SystemExit('More/Show less scroll compensation target not found')

          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          t = sw.read_text(encoding='utf-8')
          t = re.sub(
              r'const CACHE = "[^"]+";',
              'const CACHE = "stat-archive-shell-v20260927-more-smooth-v1";',
              t,
              count=1
          )
          sw.write_text(t, encoding='utf-8')
          PY

      - name: Verify patch
        run: |
          grep -F 'const motion = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";' assets/js/archive-ui.js
          grep -F 'window.scrollBy({ top: delta, left: 0, behavior: motion });' assets/js/archive-ui.js
          grep -F 'stat-archive-shell-v20260927-more-smooth-v1' sw.js

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/archive-ui.js sw.js
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Polish More and Show less transition"
            git push origin HEAD:main
          fi
