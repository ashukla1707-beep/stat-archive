name: Install entry subject accordion transition

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-more-scroll-anchor.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wire accordion runtime into the app shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          index = Path("index.html")
          html = index.read_text(encoding="utf-8")
          tag = '<script src="assets/js/entry-subject-transition.js?v=20260927-v1"></script>'
          anchor = '<script src="assets/js/archive-ui.js"></script>'

          if tag not in html:
              if anchor not in html:
                  raise SystemExit("archive-ui script tag not found")
              html = html.replace(anchor, anchor + tag, 1)
              index.write_text(html, encoding="utf-8")

          sw = Path("sw.js")
          text = sw.read_text(encoding="utf-8")
          asset = '"./assets/js/entry-subject-transition.js"'
          shell_anchor = '"./assets/js/pdf.js","./assets/js/core.js","./assets/js/archive-ui.js",'

          if asset not in text:
              if shell_anchor not in text:
                  raise SystemExit("service-worker app-shell anchor not found")
              text = text.replace(
                  shell_anchor,
                  shell_anchor + '\n  ' + asset + ',',
                  1
              )

          text = re.sub(
              r'const CACHE = "[^"]+";',
              'const CACHE = "stat-archive-shell-v20260927-entry-accordion-v1";',
              text,
              count=1
          )
          sw.write_text(text, encoding="utf-8")
          PY

      - name: Verify transition runtime
        run: |
          node --check assets/js/entry-subject-transition.js
          grep -F 'entry-subject-transition.js?v=20260927-v1' index.html
          grep -F '"./assets/js/entry-subject-transition.js"' sw.js
          grep -F 'stat-archive-shell-v20260927-entry-accordion-v1' sw.js

      - name: Commit app-shell wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Use accordion transition for More and Show less"
            git push origin HEAD:main
          fi
