# Temporary registered runner for the 2026-09-27 Menu level-switch regression.
name: Fix More scroll anchor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-more-scroll-anchor.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Patch Menu level history and refresh service worker cache
        run: |
          python3 - <<'PY'
          from pathlib import Path

          core = Path('assets/js/core.js')
          source = core.read_text(encoding='utf-8')
          old = 'window.history.replaceState({ level: value }, "", url.href);'
          new = 'window.history.replaceState({ ...(window.history.state || {}), level: value }, "", url.href);'
          if source.count(old) != 1:
              raise SystemExit(f'Expected one old setLevelUI history write; found {source.count(old)}')
          core.write_text(source.replace(old, new, 1), encoding='utf-8')

          sw = Path('sw.js')
          text = sw.read_text(encoding='utf-8')
          old_cache = 'const CACHE = "stat-archive-shell-v20260926-android-version-v1521";'
          new_cache = 'const CACHE = "stat-archive-shell-v20260927-menu-level-state-v1";'
          if text.count(old_cache) != 1:
              raise SystemExit(f'Expected one old service-worker cache id; found {text.count(old_cache)}')
          sw.write_text(text.replace(old_cache, new_cache, 1), encoding='utf-8')
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Browser regression test
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/statarchive-menu-level.log 2>&1 &
          sleep 1
          cat > /tmp/menu-level-regression.cjs <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({
              viewport:{width:390,height:844},
              reducedMotion:'reduce',
              serviceWorkers:'block'
            });
            const page = await context.newPage();
            const pageErrors = [];
            page.on('pageerror', e => pageErrors.push(String(e)));

            await page.route('https://stat-archive-api.lustats.workers.dev/**', async route => {
              const url = new URL(route.request().url());
              const level = url.searchParams.get('level') === 'bsc' ? 'bsc' : 'msc';
              if (url.pathname.endsWith('/entries')) {
                await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({entries:[]})});
                return;
              }
              if (url.pathname.endsWith('/subjects')) {
                const subjects = level === 'bsc'
                  ? [{id:'bsc-regression',code:'BSC_TEST',name:'BSc Regression Subject'}]
                  : [{id:'msc-regression',code:'MSC_TEST',name:'MSc Regression Subject'}];
                await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({subjects})});
                return;
              }
              await route.fulfill({status:200,contentType:'application/json',body:'{}'});
            });

            await page.goto('http://127.0.0.1:4173/index.html?level=msc', {
              waitUntil:'domcontentloaded', timeout:30000
            });
            await page.waitForFunction(() => !!window.__statArchiveNavigation, null, {timeout:15000});
            await page.waitForFunction(() => document.querySelector('#subjectFilterRow')?.textContent?.includes('MSc Regression Subject'), null, {timeout:15000});

            async function state() {
              return page.evaluate(() => ({
                urlLevel:new URL(location.href).searchParams.get('level'),
                nav:window.__statArchiveNavigation?.state?.(),
                history:{...(history.state || {})},
                subjectText:document.querySelector('#subjectFilterRow')?.textContent || '',
                mscHero:document.getElementById('levelMscBtn')?.getAttribute('aria-pressed'),
                bscHero:document.getElementById('levelBscBtn')?.getAttribute('aria-pressed'),
                mscMenu:document.getElementById('menuMscLevelBtn')?.getAttribute('aria-pressed'),
                bscMenu:document.getElementById('menuBscLevelBtn')?.getAttribute('aria-pressed')
              }));
            }

            // Exact reported flow: M.Sc Home -> Menu -> B.Sc -> close Menu.
            await page.click('#mainMenuBtn');
            await page.waitForSelector('#mainSideMenu.is-open');
            let s = await state();
            if (s.nav !== 'menu') throw new Error('Menu did not own canonical history before switch: '+JSON.stringify(s));

            await page.click('#menuBscLevelBtn');
            await page.waitForFunction(() => new URL(location.href).searchParams.get('level') === 'bsc');
            await page.waitForFunction(() => document.querySelector('#subjectFilterRow')?.textContent?.includes('BSc Regression Subject'), null, {timeout:10000});
            s = await state();
            if (s.history.statArchiveNav !== 'menu' || s.history.level !== 'bsc' || s.bscHero !== 'true' || s.bscMenu !== 'true') {
              throw new Error('B.Sc Menu switch did not preserve navigation state: '+JSON.stringify(s));
            }

            await page.click('#mainMenuCloseBtn');
            await page.waitForFunction(() => window.__statArchiveNavigation?.state?.() === 'home', null, {timeout:5000});
            await page.waitForFunction(() => !document.getElementById('mainSideMenu')?.classList.contains('is-open'), null, {timeout:5000});
            s = await state();
            if (s.urlLevel !== 'bsc' || !s.subjectText.includes('BSc Regression Subject') || s.subjectText.includes('MSc Regression Subject') || s.bscHero !== 'true') {
              throw new Error('Closing Menu reverted B.Sc back to M.Sc: '+JSON.stringify(s));
            }

            // Reverse direction: B.Sc Home -> Menu -> M.Sc -> close Menu.
            await page.click('#mainMenuBtn');
            await page.waitForSelector('#mainSideMenu.is-open');
            await page.click('#menuMscLevelBtn');
            await page.waitForFunction(() => new URL(location.href).searchParams.get('level') === 'msc');
            await page.waitForFunction(() => document.querySelector('#subjectFilterRow')?.textContent?.includes('MSc Regression Subject'), null, {timeout:10000});
            s = await state();
            if (s.history.statArchiveNav !== 'menu' || s.history.level !== 'msc' || s.mscHero !== 'true' || s.mscMenu !== 'true') {
              throw new Error('M.Sc Menu switch did not preserve navigation state: '+JSON.stringify(s));
            }

            await page.click('#mainMenuCloseBtn');
            await page.waitForFunction(() => window.__statArchiveNavigation?.state?.() === 'home', null, {timeout:5000});
            s = await state();
            if (s.urlLevel !== 'msc' || !s.subjectText.includes('MSc Regression Subject') || s.subjectText.includes('BSc Regression Subject') || s.mscHero !== 'true') {
              throw new Error('Closing Menu reverted/changed M.Sc unexpectedly: '+JSON.stringify(s));
            }

            // The original hero-section switch must remain functional.
            await page.click('#levelBscBtn');
            await page.waitForFunction(() => new URL(location.href).searchParams.get('level') === 'bsc');
            await page.waitForFunction(() => document.querySelector('#subjectFilterRow')?.textContent?.includes('BSc Regression Subject'), null, {timeout:10000});
            s = await state();
            if (s.urlLevel !== 'bsc' || s.bscHero !== 'true') {
              throw new Error('Hero switch regressed: '+JSON.stringify(s));
            }

            console.log('PASS: Menu and hero level switching stay synchronized in both directions.');
            if (pageErrors.length) console.log('Non-fatal page errors:', pageErrors);
            await context.close();
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          node /tmp/menu-level-regression.cjs

      - name: Commit only after passing regression test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Restore this pre-existing maintenance workflow exactly as it was
          # before it was temporarily used as the registered test runner.
          git checkout HEAD^ -- .github/workflows/fix-more-scroll-anchor.yml

          # Remove the unregistered temporary workflow created during diagnosis.
          git rm -f .github/workflows/apply-menu-level-state-fix-2026-09-27.yml || true

          git add assets/js/core.js sw.js .github/workflows/fix-more-scroll-anchor.yml
          git commit -m "Fix Menu M.Sc B.Sc level switching"
          git push origin HEAD:main
