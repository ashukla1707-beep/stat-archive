# Triggered after workflow registration on main.
name: Fix More scroll anchor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-more-scroll-anchor.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep position when expanding entry subjects
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('assets/js/archive-ui.js')
          s = p.read_text()
          old = '''    moreBtn.onclick = () => {
      // Preserve the viewport relative to this results control while render()
      // inserts/removes subject groups above it. This is the "More" shown
      // beneath the archive subject sections (not the filter-row More).
      const beforeTop = moreWrap.getBoundingClientRect().top;
      moreBtn.blur();

      showAllEntrySubjects = !showAllEntrySubjects;
      render();

      // Find the newly rendered More/Show less control and compensate only
      // for the layout displacement caused by inserting/removing groups.
      const replacement = grid.querySelector(".entry-subject-more-wrap");
      if (replacement) {
        const afterTop = replacement.getBoundingClientRect().top;
        const delta = afterTop - beforeTop;
        if (Math.abs(delta) > 0.5) {
          window.scrollBy({ top: delta, left: 0, behavior: "auto" });
        }
      }
    };'''
          new = '''    moreBtn.onclick = () => {
      // Keep the last currently visible subject row anchored in the same
      // viewport position. Expanding should continue naturally from the entry
      // above More, not move the user to the newly-created bottom of the list.
      const rows = grid.querySelectorAll(".subject-row[data-subject-code]");
      const anchorRow = rows.length ? rows[rows.length - 1] : null;
      const anchorCode = anchorRow?.dataset.subjectCode || "";
      const anchorTop = anchorRow ? anchorRow.getBoundingClientRect().top : null;
      moreBtn.blur();

      showAllEntrySubjects = !showAllEntrySubjects;
      render();

      if (anchorCode && Number.isFinite(anchorTop)) {
        requestAnimationFrame(() => {
          const replacement = grid.querySelector(`.subject-row[data-subject-code="${CSS.escape(anchorCode)}"]`);
          if (!replacement) return;
          const delta = replacement.getBoundingClientRect().top - anchorTop;
          if (Math.abs(delta) > 0.5) {
            window.scrollBy({ top: delta, left: 0, behavior: "auto" });
          }
        });
      }
    };'''
          if old not in s:
              raise SystemExit('More handler target not found')
          p.write_text(s.replace(old, new, 1))

          sw = Path('sw.js')
          t = sw.read_text()
          import re
          t = re.sub(r'const CACHE = "[^"]+";', 'const CACHE = "stat-archive-shell-v20260914-more-anchor-v1";', t, count=1)
          sw.write_text(t)
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189823+github-actions[bot]@users.noreply.github.com"
          git add assets/js/archive-ui.js sw.js
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Keep scroll position when expanding More"
            git push origin HEAD:main
          fi
