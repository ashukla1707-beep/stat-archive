name: Publish More transition V4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-more-scroll-anchor.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish V4 toggle runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Direct app-shell load: V4 must own the click immediately after archive-ui.
          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          text = re.sub(
              r'assets/js/entry-subject-transition\.js\?v=[^"\']+',
              'assets/js/entry-subject-transition.js?v=20260927-v4',
              text,
              count=1
          )
          index.write_text(text, encoding='utf-8')

          # Network-first bootstrap: prevent cached V2/V3 from registering and
          # request the V4 URL explicitly.
          align = Path('assets/js/menu-alignment-fix.js')
          text = align.read_text(encoding='utf-8')
          text = text.replace(
              'window.__STAT_ARCHIVE_ENTRY_SUBJECT_TRANSITION_V2__ = true;\n  if (window.__STAT_ARCHIVE_ENTRY_SUBJECT_V3_BOOTSTRAP__) return;\n  window.__STAT_ARCHIVE_ENTRY_SUBJECT_V3_BOOTSTRAP__ = true;',
              'window.__STAT_ARCHIVE_ENTRY_SUBJECT_TRANSITION_V2__ = true;\n  window.__STAT_ARCHIVE_ENTRY_SUBJECT_TRANSITION_V3__ = true;\n  if (window.__STAT_ARCHIVE_ENTRY_SUBJECT_V4_BOOTSTRAP__) return;\n  window.__STAT_ARCHIVE_ENTRY_SUBJECT_V4_BOOTSTRAP__ = true;'
          )
          text = text.replace(
              'assets/js/entry-subject-transition.js?v=20260927-v3',
              'assets/js/entry-subject-transition.js?v=20260927-v4'
          )
          align.write_text(text, encoding='utf-8')

          # Later fallback loaders should point at the same V4 asset.
          for filename in ['assets/js/menu-header-reference.js', 'assets/js/preview-state-guard.js']:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              text = re.sub(
                  r'assets/js/entry-subject-transition\.js\?v=20260927-v[123]',
                  'assets/js/entry-subject-transition.js?v=20260927-v4',
                  text
              )
              text = re.sub(
                  r'__STAT_ARCHIVE_ENTRY_SUBJECT_TRANSITION_LOADER_V[123]__',
                  '__STAT_ARCHIVE_ENTRY_SUBJECT_TRANSITION_LOADER_V4__',
                  text
              )
              path.write_text(text, encoding='utf-8')

          sw = Path('sw.js')
          text = sw.read_text(encoding='utf-8')
          text = re.sub(
              r'const CACHE = "[^"]+";',
              'const CACHE = "stat-archive-shell-v20260927-more-transition-v4";',
              text,
              count=1
          )
          sw.write_text(text, encoding='utf-8')
          PY

      - name: Verify V4 runtime
        run: |
          node --check assets/js/entry-subject-transition.js
          grep -F 'entry-subject-transition.js?v=20260927-v4' index.html
          grep -F '__STAT_ARCHIVE_ENTRY_SUBJECT_TRANSITION_V3__ = true' assets/js/menu-alignment-fix.js
          grep -F 'entry-subject-transition.js?v=20260927-v4' assets/js/menu-alignment-fix.js
          grep -F 'stat-archive-shell-v20260927-more-transition-v4' sw.js

      - name: Commit cache-safe V4 wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/js/menu-alignment-fix.js assets/js/menu-header-reference.js assets/js/preview-state-guard.js sw.js
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Publish natural Show less transition V4"
            git push origin HEAD:main
          fi

# Trigger after workflow registration.
