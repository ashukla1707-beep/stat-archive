name: Publish More transition V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-more-scroll-anchor.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish V2 loader and network-first runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          menu = Path('assets/js/menu-header-reference.js')
          text = menu.read_text(encoding='utf-8')
          text = text.replace(
              'assets/js/entry-subject-transition.js?v=20260927-v1',
              'assets/js/entry-subject-transition.js?v=20260927-v2'
          )
          text = text.replace(
              '__STAT_ARCHIVE_ENTRY_SUBJECT_TRANSITION_LOADER_V1__',
              '__STAT_ARCHIVE_ENTRY_SUBJECT_TRANSITION_LOADER_V2__'
          )
          menu.write_text(text, encoding='utf-8')

          sw = Path('sw.js')
          text = sw.read_text(encoding='utf-8')
          text = re.sub(
              r'const CACHE = "[^"]+";',
              'const CACHE = "stat-archive-shell-v20260927-more-transition-v2";',
              text,
              count=1
          )

          marker = "url.pathname.endsWith('/assets/js/menu-header-reference.js')||"
          live = "url.pathname.endsWith('/assets/js/entry-subject-transition.js')||"
          if live not in text:
              if marker not in text:
                  raise SystemExit('service-worker live-runtime anchor not found')
              text = text.replace(marker, marker + live, 1)

          sw.write_text(text, encoding='utf-8')
          PY

      - name: Verify V2 runtime
        run: |
          node --check assets/js/entry-subject-transition.js
          grep -F 'entry-subject-transition.js?v=20260927-v2' assets/js/menu-header-reference.js
          grep -F "url.pathname.endsWith('/assets/js/entry-subject-transition.js')" sw.js
          grep -F 'stat-archive-shell-v20260927-more-transition-v2' sw.js

      - name: Commit cache-safe V2 wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/menu-header-reference.js sw.js
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Publish More transition V2"
            git push origin HEAD:main
          fi

# Touch this file once after registration so GitHub executes the new workflow.
