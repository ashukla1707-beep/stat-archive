name: Bugfix Validate

on:
  push:
    branches:
      - bugfix/audit-current-2026-09-10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check sw.js
          find assets/js -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Verify bug-fix invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path

          speed = Path('assets/js/speed-boost.js').read_text(encoding='utf-8')
          feature = Path('assets/js/feature-polish.js').read_text(encoding='utf-8')
          accessibility = Path('assets/js/accessibility.js').read_text(encoding='utf-8')
          runtime = Path('assets/js/runtime.js').read_text(encoding='utf-8')
          hero = Path('assets/js/hero-animation.js').read_text(encoding='utf-8')
          offline = Path('assets/js/offline.js').read_text(encoding='utf-8')
          offline_hybrid = Path('assets/js/offline-library-hybrid.js').read_text(encoding='utf-8')
          core = Path('assets/js/core.js').read_text(encoding='utf-8')
          subject_panel = Path('assets/js/subject-panel.js').read_text(encoding='utf-8')

          checks = {
              'legacy archive-file fetch wrapper removed': 'window.fetch = fastFetch' not in speed,
              'legacy subject snapshot wrapper removed': 'loadSubjectsFromWorker = wrapped' not in speed,
              'legacy PDF cache purged': 'caches.delete(LEGACY_PDF_CACHE)' in speed,
              'entry refresh scoped to initiating level': 'currentLevelKey() === requestLevel' in speed,
              'feature polish execution guard present': '__statArchiveFeaturePolishLoadedV2' in feature,
              'feature polish defers to canonical autocomplete': '__statArchiveSearchSuggestionsLoadedV4' in feature,
              'feature polish has no legacy Offline Library click binding': 'webOfflineBound' not in feature,
              'modal keyboard ownership split': 'runtimeHandledIds' in accessibility,
              'history state merge present': '__saStateMergeWrapped' in accessibility,
              'reduced-motion fix present': 'statArchiveReducedMotionFix' in accessibility,
              'preview image Blob URL cleanup present': 'saBlobCleanup' in accessibility,
              'canonical search loaded before feature fallback': accessibility.index('search-suggestions.js') < accessibility.index('feature-polish.js'),
              'silent refresh captures initiating level': 'const refreshLevel = currentLevel' in runtime,
              'silent refresh drops stale course response': 'currentLevel !== refreshLevel' in runtime,
              'silent refresh does not mutate subjects in background': 'await loadSubjectsFromWorker()' not in runtime.split('async function refreshArchiveSilently()',1)[1].split('// Hard-refresh when connectivity returns.',1)[0],
              'hero duration remains 8 seconds': 'const HERO_DURATION = 8000;' in hero,
              'hero honors reduced motion in JS': 'prefers-reduced-motion: reduce' in hero and 'finishHeroAnimation(state)' in hero,
              'offline type filter has one implementation': offline.count('function renderOfflineTypeFilters(') == 1,
              'offline recent mark follows successful open': offline_hybrid.index('await openOfflineFile(id);') < offline_hybrid.index('markRecent(id);'),
              'menu level buttons call canonical switch directly': 'typeof window.switchLevel === "function"' in subject_panel and 'void chooseLevel("bsc", bscSourceBtn)' in subject_panel and 'void chooseLevel("msc", mscSourceBtn)' in subject_panel,
              'level switch rebuilds subject UI before network': core.index('renderSubjectFilters();', core.index('async function switchLevel')) < core.index('const [loadedEntries] = await Promise.all([', core.index('async function switchLevel')) and core.index('renderSubjectOptions();', core.index('async function switchLevel')) < core.index('const [loadedEntries] = await Promise.all([', core.index('async function switchLevel')),
          }

          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Bug-fix invariant failure(s):\n- ' + '\n- '.join(failed))

          print(f'Validated {len(checks)} bug-fix invariants.')
          PY
