name: Fix APK regressions
on:
  push:
    paths:
      - '.github/workflows/fix-admin-reply-name.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch APK regressions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          sup='<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
          pos=s.find(sup)
          if pos < 0: raise SystemExit('supabase anchor missing')
          after=pos+len(sup)
          m=re.match(r'\s*(<script>\(function\(\)\{const menuBtn=.*?</script>)',s[after:],flags=re.S)
          if m:
              boot=m.group(1); end=after+m.end()
              s=s[:pos]+boot+'\n'+sup+s[end:]
              p.write_text(s,encoding='utf-8')

          p=Path('assets/js/download-fix.js'); s=p.read_text(encoding='utf-8')
          old='  document.addEventListener("click", event => {\n    if (isAndroid()) return;\n\n    const btn = event.target instanceof Element ? event.target.closest(".dl-btn") : null;'
          new='  document.addEventListener("click", event => {\n    const btn = event.target instanceof Element ? event.target.closest(".dl-btn") : null;'
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('download status anchor missing')
          p.write_text(s,encoding='utf-8')

          p=Path('assets/js/hero-animation.js'); s=p.read_text(encoding='utf-8')
          old='  document.addEventListener("statarchive:theme-change", positionMeanSymbol);\n})();'
          new='''  document.addEventListener("statarchive:theme-change", positionMeanSymbol);
  if (document.body) {
    new MutationObserver(() => requestAnimationFrame(positionMeanSymbol))
      .observe(document.body, { attributes:true, attributeFilter:["data-theme"] });
  }
  new MutationObserver(() => requestAnimationFrame(positionMeanSymbol))
    .observe(document.documentElement, { attributes:true, attributeFilter:["data-theme"] });
})();'''
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('mu anchor missing')
          p.write_text(s,encoding='utf-8')

          p=Path('sw.js'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'const CACHE = "stat-archive-shell-[^"]+";','const CACHE = "stat-archive-shell-v20260915-apk-regression-v1";',s,count=1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/js/download-fix.js assets/js/hero-animation.js sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix APK offline menu, action status and mu theme sync"
          git push
