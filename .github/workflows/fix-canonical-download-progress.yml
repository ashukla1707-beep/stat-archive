name: Remove transfer progress UI
on:
  push:
    paths:
      - '.github/workflows/fix-canonical-download-progress.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove progress implementations instead of hiding them
        shell: python
        run: |
          from pathlib import Path
          import re

          # Download: keep transfer/save behavior, remove progress DOM/CSS/percentage runtime.
          p=Path('assets/js/download-progress-canonical.js')
          s=p.read_text()
          start=s.find('function installStyle()')
          end=s.find('async function readResponse', start)
          if start>=0 and end>=0:
              s=s[:start] + 'function paint(){}\nfunction hideInline(){}\n' + s[end:]
          s=re.sub(r'if\(btn&&total>0\)btn\.textContent=`Downloading…[^;]+;','',s)
          s=s.replace('btn.textContent="Downloading… 0%"','btn.textContent="Downloading…"')
          s=re.sub(r'\nwindow\.statArchiveTransferProgress=\{.*?\};','',s,flags=re.S)
          p.write_text(s)

          # Offline: remove streaming/progress implementation entirely and return to a plain blob save.
          p=Path('assets/js/offline.js')
          s=p.read_text()
          s=s.replace('"Saving… 0%"','"Saving…"')
          s=re.sub(r'\n\s*window\.statArchiveTransferProgress\?\.(?:show|update|finish|hide)\([^;]*\);','',s)
          a=s.find('    const totalBytes =')
          b=s.find('\n\n    const meta =',a)
          if a>=0 and b>=0:
              s=s[:a]+'    const blob =\n      await response.blob();'+s[b:]
          p.write_text(s)

          # Remove the old web progress controller physically appended to the shared APK/PWA/web runtime.
          p=Path('assets/js/phone-landscape-hero.js')
          s=p.read_text()
          marker='/* Web-only real download progress.'
          i=s.find(marker)
          if i>=0:
              s=s[:i].rstrip()+"\n"
          p.write_text(s)

          # Remove previously injected transfer-state styling from the card styling source.
          p=Path('assets/js/action-spacing-fix.js')
          s=p.read_text()
          s=re.sub(r'\n?/\* Download and Offline share one visual state system\..*?(?=@media \(hover:none\),\(pointer:coarse\))','\n',s,flags=re.S)
          p.write_text(s)

          # Cache bump: web, installed PWA and APK WebView must all receive the source removal.
          p=Path('sw.js')
          s=p.read_text()
          s=re.sub(r"stat-archive-shell-v[^'\"]+",'stat-archive-shell-v20260916-no-transfer-progress-v10',s,count=1)
          s=re.sub(r'download-progress-canonical\.js\?v=[^"\']+','download-progress-canonical.js?v=20260916-no-progress-v10',s)
          s=re.sub(r'phone-landscape-hero\.js\?v=[^"\']+','phone-landscape-hero.js?v=20260916-no-progress-v10',s)
          s=re.sub(r'action-spacing-fix\.js\?v=[^"\']+','action-spacing-fix.js?v=20260916-no-progress-v10',s)
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          s=re.sub(r'download-progress-canonical\.js\?v=[^"\']+','download-progress-canonical.js?v=20260916-no-progress-v10',s)
          s=re.sub(r'assets/js/offline\.js(?:\?v=[^"\']+)?','assets/js/offline.js?v=20260916-no-progress-v10',s)
          s=re.sub(r'phone-landscape-hero\.js\?v=[^"\']+','phone-landscape-hero.js?v=20260916-no-progress-v10',s)
          p.write_text(s)
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/download-progress-canonical.js assets/js/offline.js assets/js/phone-landscape-hero.js assets/js/action-spacing-fix.js index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Remove Download and Offline progress UI implementations"
          git push
