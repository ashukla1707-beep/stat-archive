name: Fix canonical Download progress
on:
  push:
    paths:
      - '.github/workflows/fix-canonical-download-progress.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Share progress UI with Offline save
        shell: python
        run: |
          from pathlib import Path
          p = Path('assets/js/download-progress-canonical.js')
          s = p.read_text()
          marker = 'window.statArchiveCanonicalDownload=transfer;'
          patch = r'''window.statArchiveTransferProgress={
            show(btn,loaded=0,total=0){paint(btn,loaded,total)},
            update(btn,loaded,total){paint(btn,loaded,total)},
            finish(btn,total=1){paint(btn,total,total,true)},
            hide(btn){hideInline(btn)}
          };
          function installOfflineProgress(){
            if(window.__STAT_ARCHIVE_OFFLINE_PROGRESS_SHARED_V1__)return;
            const original=window.saveEntryOffline;
            if(typeof original!=="function")return;
            window.__STAT_ARCHIVE_OFFLINE_PROGRESS_SHARED_V1__=true;
            window.saveEntryOffline=async function(entry,btn){
              if(!entry)return original.apply(this,arguments);
              const already=(()=>{try{return offlineEntryIds.has(String(entry.id))}catch(_){return false}})();
              if(already)return original.apply(this,arguments);
              let stopped=false,timer=null,pct=0;
              const total=100;
              try{
                paint(btn,0,total);
                if(btn)btn.textContent="Saving… 0%";
                timer=setInterval(()=>{
                  if(stopped)return;
                  pct=Math.min(92,pct+(pct<45?7:pct<75?4:2));
                  paint(btn,pct,total);
                  if(btn)btn.textContent=`Saving… ${pct}%`;
                },90);
                const result=await original.apply(this,arguments);
                stopped=true;clearInterval(timer);
                paint(btn,total,total,true);
                if(btn){btn.disabled=false;btn.textContent="✓ Offline";btn.classList.add("is-saved")}
                return result;
              }catch(err){
                stopped=true;clearInterval(timer);hideInline(btn);throw err;
              }
            };
          }
          installOfflineProgress();
          document.addEventListener("DOMContentLoaded",installOfflineProgress,{once:true});
          window.addEventListener("load",installOfflineProgress,{once:true});
          window.statArchiveCanonicalDownload=transfer;'''
          if 'window.__STAT_ARCHIVE_OFFLINE_PROGRESS_SHARED_V1__' not in s:
              if marker not in s: raise SystemExit('canonical marker not found')
              s = s.replace(marker, patch, 1)
              p.write_text(s)

          index = Path('index.html')
          x = index.read_text()
          x = x.replace('download-progress-canonical.js?v=20260915-2','download-progress-canonical.js?v=20260915-3')
          index.write_text(x)

          sw = Path('sw.js')
          x = sw.read_text()
          x = x.replace('stat-archive-shell-v20260915-canonical-download-progress-v7','stat-archive-shell-v20260915-shared-transfer-progress-v8')
          x = x.replace('v=20260915-canonical-download-progress-v7','v=20260915-shared-transfer-progress-v8')
          sw.write_text(x)
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js assets/js/download-progress-canonical.js
          git diff --cached --quiet && exit 0
          git commit -m "Unify Download and Offline percentage progress"
          git push
