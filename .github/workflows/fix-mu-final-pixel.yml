name: Fix mu final pixel

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-mu-final-pixel.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align first-paint and loaded mu position
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # 1) The last mobile CSS owner still used 3px while JS uses 4px.
          p=Path('assets/styles.css')
          s=p.read_text(encoding='utf-8')
          old='''.hero-probability .axis-mid{\n    bottom:3px !important;\n  }'''
          new='''.hero-probability .axis-mid{\n    bottom:4px !important;\n  }'''
          if old not in s:
              raise SystemExit('Expected final mobile mu 3px rule not found in styles.css')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # 2) Lock the very first HTML paint to the exact same phone geometry.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='''  letter-spacing:0!important;\n}\n</style>'''
          replacement='''  letter-spacing:0!important;\n}\n@media(max-width:700px){\n  .hero-probability .axis-mid{\n    position:absolute!important;\n    left:50%!important;\n    right:auto!important;\n    top:auto!important;\n    bottom:4px!important;\n    transform:translateX(-50%)!important;\n    margin:0!important;\n    padding:0!important;\n  }\n}\n</style>'''
          if marker not in s:
              raise SystemExit('statMuInitialStyle marker not found')
          s=s.replace(marker,replacement,1)
          p.write_text(s,encoding='utf-8')

          # 3) Purge the cached 3px stylesheet/HTML shell.
          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('const CACHE = "stat-archive-shell-v20260913-hero-spacing-v4";',
                      'const CACHE = "stat-archive-shell-v20260913-mu-final-pixel-v5";')
          p.write_text(s,encoding='utf-8')

          # Validation
          styles=Path('assets/styles.css').read_text(encoding='utf-8')
          index=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          assert 'bottom:3px !important;' not in styles
          assert 'bottom:4px !important;' in styles
          assert 'bottom:4px!important;' in index.split('id="statMuInitialStyle"',1)[1].split('</style>',1)[0]
          assert 'stat-archive-shell-v20260913-mu-final-pixel-v5' in sw
          print('Mu first-paint and loaded position now match at 4px exactly.')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189823+github-actions[bot]@users.noreply.github.com"
          git add assets/styles.css index.html sw.js
          git commit -m "Remove final 1px mu shift on refresh"
          git push origin HEAD:main
