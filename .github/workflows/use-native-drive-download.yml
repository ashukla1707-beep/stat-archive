name: Preserve controlled download progress

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify download reliability layer
        run: |
          test -f assets/js/download-fix.js
          echo "Stat Archive owns the network transfer so live byte progress remains available on web and APK."