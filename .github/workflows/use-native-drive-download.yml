name: Prefer native Drive download in APK

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch download fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/js/download-fix.js')
          s = p.read_text()
          old = '''      const inlineUrl = typeof window.statArchiveDriveStreamUrl === "function"\n        ? window.statArchiveDriveStreamUrl(entry, "inline")\n        : entry.driveUrl;\n\n      const response = await nativeFetch()(inlineUrl, {\n'''
          new = '''      const inlineUrl = typeof window.statArchiveDriveStreamUrl === "function"\n        ? window.statArchiveDriveStreamUrl(entry, "inline")\n        : entry.driveUrl;\n\n      /* Newer APKs can hand the same-origin stream URL straight to Android's\n         DownloadManager. That avoids loading a 100+ MB PDF into JS/base64. */\n      if (isAndroid() && typeof window.AndroidBridge.downloadUrl === "function") {\n        let nativeName = "";\n        try {\n          if (typeof window.archiveDownloadName === "function") {\n            nativeName = window.archiveDownloadName(entry);\n          }\n        } catch (_) {}\n        if (!nativeName) nativeName = entry.title || entry.filename || "Stat Archive file.pdf";\n        nativeName = cleanName(nativeName);\n        if (!/\\.pdf$/i.test(nativeName)) nativeName += ".pdf";\n        window.AndroidBridge.downloadUrl(inlineUrl, nativeName, "application/pdf");\n        try { window.incrementActivity?.("download"); } catch (_) {}\n        return;\n      }\n\n      const response = await nativeFetch()(inlineUrl, {\n'''
          if 'AndroidBridge.downloadUrl' not in s:
              if old not in s:
                  raise SystemExit('target block not found')
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/download-fix.js
          git commit -m "Prefer native APK download for Drive PDFs"
          git push
