name: Fix mu first paint

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-mu-first-paint.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set initial mu size to 12px
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '''<style id="statMuInitialStyle">\n.hero-probability .axis-mid{\n  font-family:Arial,Helvetica,sans-serif!important;\n  font-size:14px!important;'''
          new = '''<style id="statMuInitialStyle">\n.hero-probability .axis-mid{\n  font-family:Arial,Helvetica,sans-serif!important;\n  font-size:12px!important;'''
          if old not in text:
              raise SystemExit('Expected 14px initial mu style was not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189823+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Set mu to 12px from first paint"
          git push origin HEAD:main
