name: Fix desktop hard refresh menu flash

on:
  push:
    paths:
      - '.github/workflows/fix-desktop-hard-refresh-menu-flash.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch first-paint menu startup and phone landscape hero
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          guard = '''<style id="statMenuHardRefreshGuard">
          /* First-paint guard: never paint legacy menu markup during a restored
             /?menu=1 hard refresh. Released atomically by menu-header-reference.js. */
          html:not(.stat-menu-reference-ready) #mainSideMenu.is-open,
          html:not(.stat-menu-reference-ready) #mainMenuBackdrop.is-open{
            visibility:hidden!important;
            opacity:0!important;
            pointer-events:none!important;
            transition:none!important;
          }
          </style>'''

          if 'id="statMenuHardRefreshGuard"' not in s:
              s = s.replace('</head>', guard + '\n</head>', 1)

          startup_tag = '<script data-stat-startup-polish="1" src="assets/js/startup-polish.js?v=20260914-hard-refresh-v1"></script>'
          if 'data-stat-startup-polish="1"' not in s:
              s = s.replace(
                  '<script src="assets/js/service-worker-register.js"></script>',
                  startup_tag + '\n<script src="assets/js/service-worker-register.js"></script>',
                  1
              )

          direct = [
              ('assets/js/menu-polish.js', '<script src="assets/js/menu-polish.js?v=20260914-hard-refresh-v1"></script>'),
              ('assets/js/menu-alignment-fix.js', '<script src="assets/js/menu-alignment-fix.js?v=20260914-hard-refresh-v1"></script>'),
              ('assets/js/menu-header-reference.js', '<script src="assets/js/menu-header-reference.js?v=20260914-hard-refresh-v1"></script>'),
          ]
          anchor = '<script src="assets/js/public-reviews.js?v=20260914-public-v1"></script>'
          for needle, tag in direct:
              if needle not in s:
                  s = s.replace(anchor, anchor + '\n' + tag, 1)
                  anchor = tag

          landscape_tag = '<script src="assets/js/phone-landscape-hero.js?v=20260914-1"></script>'
          if 'assets/js/phone-landscape-hero.js' not in s:
              s = s.replace('</body>', landscape_tag + '\n</body>', 1)

          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          w = sw.read_text(encoding='utf-8')
          w = re.sub(
              r'const CACHE = "[^"]+";',
              'const CACHE = "stat-archive-shell-v20260914-phone-landscape-v1";',
              w,
              count=1
          )

          if '"./assets/js/phone-landscape-hero.js"' not in w:
              needle = '"./assets/js/hero-layout-fix.js","./assets/js/action-spacing-fix.js",'
              replacement = '"./assets/js/hero-layout-fix.js","./assets/js/phone-landscape-hero.js","./assets/js/action-spacing-fix.js",'
              if needle in w:
                  w = w.replace(needle, replacement, 1)

          phone_const = 'const PHONE_LANDSCAPE_HERO_TAG = \'<script src="./assets/js/phone-landscape-hero.js?v=20260914-1"></script>\';'
          if 'PHONE_LANDSCAPE_HERO_TAG' not in w:
              hero_const = re.search(r"const HERO_FIX_SCRIPT_TAG = .*?;\n", w)
              if hero_const:
                  pos = hero_const.end()
                  w = w[:pos] + phone_const + '\n' + w[pos:]

          phone_inject = "  if (!out.includes('assets/js/phone-landscape-hero.js')) out = out.replace('</body>', `${PHONE_LANDSCAPE_HERO_TAG}\\n</body>`);"
          if "if (!out.includes('assets/js/phone-landscape-hero.js'))" not in w:
              anchor_text = "  if (!out.includes('assets/js/hero-layout-fix.js')) out = out.replace('</body>', `${HERO_FIX_SCRIPT_TAG}\\n</body>`);"
              if anchor_text in w:
                  w = w.replace(anchor_text, anchor_text + '\n' + phone_inject, 1)

          live_line = "    url.pathname.endsWith('/assets/js/phone-landscape-hero.js') ||"
          if "url.pathname.endsWith('/assets/js/phone-landscape-hero.js')" not in w:
              anchor_text = "    url.pathname.endsWith('/assets/js/hero-layout-fix.js') ||"
              if anchor_text in w:
                  w = w.replace(anchor_text, anchor_text + '\n' + live_line, 1)

          sw.write_text(w, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          if git diff --quiet -- index.html sw.js; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Install phone landscape hero guard"
          git push
