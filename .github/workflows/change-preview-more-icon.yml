name: Refresh PWA icons from splash
on:
  push:
    branches: [main]
    paths: ['.github/workflows/change-preview-more-icon.yml']
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python3 -m pip install --quiet pillow
      - name: Build PWA icons from current Android splash
        run: |
          curl -L --fail --retry 3 \
            -o /tmp/stat-archive-splash.webp \
            https://raw.githubusercontent.com/ashukla1707-beep/statarchive-android/main/app/src/main/res/drawable-nodpi/splash_exact.webp
          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path

          src = Image.open('/tmp/stat-archive-splash.webp').convert('RGBA')
          out = Path('icons')
          out.mkdir(exist_ok=True)

          def cover(size):
              # Home-screen icon: use the current splash artwork itself, cropped
              # centrally to a square so it is large enough to be recognisable.
              return ImageOps.fit(src, (size, size), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))

          def maskable(size):
              # Keep artwork inside the maskable safe zone and preserve aspect ratio.
              canvas = Image.new('RGBA', (size, size), (0, 0, 0, 255))
              inner = int(size * 0.80)
              art = src.copy()
              art.thumbnail((inner, inner), Image.Resampling.LANCZOS)
              x = (size - art.width) // 2
              y = (size - art.height) // 2
              canvas.alpha_composite(art, (x, y))
              return canvas

          cover(192).convert('RGB').save(out / 'icon-192-splash.png', 'PNG', optimize=True)
          cover(512).convert('RGB').save(out / 'icon-512-splash.png', 'PNG', optimize=True)
          maskable(512).convert('RGB').save(out / 'icon-512-splash-maskable.png', 'PNG', optimize=True)
          PY
      - name: Commit refreshed PWA icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189823+github-actions[bot]@users.noreply.github.com"
          git add icons/icon-192-splash.png icons/icon-512-splash.png icons/icon-512-splash-maskable.png
          git commit -m "Use current splash artwork for PWA icons" || exit 0
          git push