name: Refresh PWA icons from splash
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/change-preview-more-icon.yml'
      - 'manifest.json'
      - 'launch.html'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python3 -m pip install --quiet pillow
      - name: Reconstruct approved Android splash
        run: |
          : > /tmp/splash_exact.b64
          for file in \
            .splash_exact_png/part01.b64 \
            .splash_exact_png/part02.b64 \
            .splash_exact_png/part03.b64 \
            .splash_exact_png/part04.b64 \
            .splash_exact_png/part05.b64 \
            .splash_exact_png/part06.b64 \
            .splash_exact_png/part07.b64 \
            .splash_exact_webp/part08a.b64 \
            .splash_exact_webp/part08b1a.b64 \
            .splash_exact_webp/part08b1b1.b64 \
            .splash_exact_webp/part08b1b2a.b64 \
            .splash_exact_webp/part08b1b2b1.b64 \
            .splash_exact_webp/part08b1b2b2.b64 \
            .splash_exact_webp/part08b2.b64 \
            .splash_exact_webp/part08c.b64 \
            .splash_exact_webp/part08d.b64 \
            .splash_exact_png/part09.b64; do
            curl -L --fail --retry 3 \
              "https://raw.githubusercontent.com/ashukla1707-beep/statarchive-android/main/${file}" \
              >> /tmp/splash_exact.b64
          done
          test "$(stat -c%s /tmp/splash_exact.b64)" = "132276"
          base64 --decode /tmp/splash_exact.b64 > /tmp/splash_exact.webp
          test "$(stat -c%s /tmp/splash_exact.webp)" = "99206"
          echo "a0c152dadc7e9e95a932627c75f7d011ed04b3899b6c30d3e9fbb0d57a7e6018  /tmp/splash_exact.webp" | sha256sum -c -
      - name: Build exact PWA branding
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Image.open('/tmp/splash_exact.webp').convert('RGB')
          out = Path('icons')
          out.mkdir(exist_ok=True)

          # Use the exact same centered-square crop as the Android release build.
          w, h = source.size
          side = min(w, h)
          left = (w - side) // 2
          top = (h - side) // 2
          icon = source.crop((left, top, left + side, top + side))

          icon.resize((192, 192), Image.Resampling.LANCZOS).save(
              out / 'icon-192.png', 'PNG', optimize=True
          )
          icon.resize((512, 512), Image.Resampling.LANCZOS).save(
              out / 'icon-512.png', 'PNG', optimize=True
          )

          # Maskable icon keeps the same artwork with safe padding.
          mask = Image.new('RGB', (512, 512), (0, 0, 0))
          safe = icon.resize((410, 410), Image.Resampling.LANCZOS)
          mask.paste(safe, ((512 - 410) // 2, (512 - 410) // 2))
          mask.save(out / 'icon-512-maskable.png', 'PNG', optimize=True)

          # Full approved artwork for the custom PWA splash.
          source.save(out / 'pwa-splash.webp', 'WEBP', quality=100, method=6)
          PY
      - name: Commit refreshed PWA branding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189823+github-actions[bot]@users.noreply.github.com"
          git add icons/icon-192.png icons/icon-512.png icons/icon-512-maskable.png icons/pwa-splash.webp
          git commit -m "Use approved splash artwork for PWA branding" || exit 0
          git push