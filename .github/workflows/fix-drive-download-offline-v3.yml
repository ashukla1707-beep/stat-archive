name: Fix Drive download offline v3
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-drive-download-offline-v3.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply robust Drive fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Service worker: force fresh runtime files and never intercept Drive streaming.
          p=Path('sw.js'); s=p.read_text()
          s=s.replace('const CACHE = "stat-archive-shell-v20260913-mu-light-match-v6";', 'const CACHE = "stat-archive-shell-v20260914-drive-runtime-v3";', 1)
          marker="  const isDocumentNavigation = request.mode === 'navigate';\n"
          if "url.pathname === '/drive-file'" not in s:
              s=s.replace(marker, "  if (url.pathname === '/drive-file') {\n    event.respondWith(fetch(request));\n    return;\n  }\n\n"+marker, 1)
          live="  const isLiveRuntime =\n"
          if "url.pathname.endsWith('/assets/js/core.js')" not in s:
              s=s.replace(live, live+"    url.pathname.endsWith('/assets/js/core.js') ||\n    url.pathname.endsWith('/assets/js/archive-ui.js') ||\n    url.pathname.endsWith('/assets/js/download-fix.js') ||\n    url.pathname.endsWith('/assets/js/offline.js') ||\n", 1)
          # bump injected download tag too
          s=s.replace('download-fix.js?v=20260905-1','download-fix.js?v=20260914-drive-v3')
          p.write_text(s)

          # Worker: robust Drive fetch with multiple Google endpoints.
          p=Path('worker.js')
          p.write_text(r'''function cleanFilename(value) {
  const raw = String(value || "Stat Archive file.pdf").replace(/[\\/:*?"<>|\r\n]+/g, "_").trim();
  return raw || "Stat Archive file.pdf";
}

function driveId(raw) {
  const value = String(raw || "").trim();
  const match = value.match(/\/file\/d\/([A-Za-z0-9_-]+)/i)
    || value.match(/[?&]id=([A-Za-z0-9_-]+)/i)
    || value.match(/\/d\/([A-Za-z0-9_-]+)/i);
  return match ? match[1] : "";
}

async function fetchDriveFile(id, request) {
  const headers = new Headers();
  headers.set('User-Agent', request.headers.get('User-Agent') || 'Mozilla/5.0');
  headers.set('Accept', 'application/pdf,application/octet-stream,*/*');
  const range = request.headers.get('Range');
  if (range) headers.set('Range', range);

  const candidates = [
    `https://drive.usercontent.google.com/download?id=${encodeURIComponent(id)}&export=download&confirm=t`,
    `https://drive.google.com/uc?export=download&id=${encodeURIComponent(id)}&confirm=t`,
    `https://drive.google.com/uc?id=${encodeURIComponent(id)}&export=download`
  ];

  let last = null;
  for (const target of candidates) {
    try {
      const r = await fetch(target, { method: 'GET', headers, redirect: 'follow' });
      last = r;
      const ct = (r.headers.get('content-type') || '').toLowerCase();
      if (r.ok && !ct.includes('text/html')) return r;
    } catch (_) {}
  }
  return last;
}

export default {
  async fetch(request, env) {
    const url = new URL(request.url);
    if (url.pathname === '/drive-file') {
      const id = driveId(url.searchParams.get('id'));
      if (!id) return new Response('Invalid Drive file', { status: 400 });
      const requestedName = cleanFilename(url.searchParams.get('name'));
      const mode = url.searchParams.get('mode') === 'download' ? 'attachment' : 'inline';
      const upstream = await fetchDriveFile(id, request);
      if (!upstream || !upstream.ok) {
        return new Response('Drive file unavailable', { status: upstream?.status || 502 });
      }
      const ct = (upstream.headers.get('content-type') || '').toLowerCase();
      if (ct.includes('text/html')) {
        return new Response('Drive returned a confirmation page instead of the file', { status: 502 });
      }

      const headers = new Headers();
      headers.set('Content-Type', upstream.headers.get('Content-Type') || 'application/pdf');
      const length = upstream.headers.get('Content-Length');
      if (length) headers.set('Content-Length', length);
      const range = upstream.headers.get('Content-Range');
      if (range) headers.set('Content-Range', range);
      const acceptRanges = upstream.headers.get('Accept-Ranges');
      if (acceptRanges) headers.set('Accept-Ranges', acceptRanges);
      headers.set('Cache-Control', 'private, no-store');
      headers.set('Content-Disposition', `${mode}; filename*=UTF-8''${encodeURIComponent(requestedName)}`);
      headers.set('X-Content-Type-Options', 'nosniff');
      return new Response(upstream.body, { status: upstream.status, headers });
    }
    return env.ASSETS.fetch(request);
  }
};
''')

          # Download: fetch same-origin proxy first, then save a Blob with archive filename.
          p=Path('assets/js/download-fix.js'); s=p.read_text()
          old="""      if (entry?.driveUrl) {
        const url = typeof statArchiveDriveStreamUrl === 'function' ? statArchiveDriveStreamUrl(entry, 'download') : entry.driveUrl;
        const a = document.createElement('a');
        a.href = url;
        a.download = typeof archiveDownloadName === 'function' ? archiveDownloadName(entry) : (entry.title || entry.filename || 'Stat Archive file.pdf');
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        a.remove();
        try { incrementActivity('download'); } catch (_) {}
        return;
      }
"""
          new="""      if (entry?.driveUrl) {
        const proxyUrl = typeof statArchiveDriveStreamUrl === 'function' ? statArchiveDriveStreamUrl(entry, 'download') : '';
        if (!proxyUrl) throw new Error('Drive download URL is unavailable.');
        const response = await fetch(proxyUrl, { method: 'GET', cache: 'no-store', credentials: 'same-origin' });
        if (!response.ok) throw new Error(`Drive download failed (${response.status})`);
        const blob = await response.blob();
        if (!blob.size) throw new Error('Drive returned an empty file.');
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = typeof archiveDownloadName === 'function' ? archiveDownloadName(entry) : (entry.title || entry.filename || 'Stat Archive file.pdf');
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
        try { incrementActivity('download'); } catch (_) {}
        return;
      }
"""
          if old not in s: raise SystemExit('download Drive block not found')
          p.write_text(s.replace(old,new,1))

          # Offline: same-origin credentials and useful status error.
          p=Path('assets/js/offline.js'); s=p.read_text()
          s=s.replace('const response = await fetch(fileUrl,{method:"GET",cache:"no-store",credentials:"omit"});', 'const response = await fetch(fileUrl,{method:"GET",cache:"no-store",credentials: entry.driveUrl ? "same-origin" : "omit"});', 1)
          s=s.replace('''    if (!response.ok) {
      throw new Error(
        "Couldn't save that file for offline use."
      );
    }''', '''    if (!response.ok) {
      throw new Error(
        entry.driveUrl
          ? `Couldn't save Drive file offline (${response.status}).`
          : "Couldn't save that file for offline use."
      );
    }''', 1)
          p.write_text(s)
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189823+github-actions[bot]@users.noreply.github.com"
          git add sw.js worker.js assets/js/download-fix.js assets/js/offline.js
          git commit -m "Fix Drive offline and download end to end"
          git push