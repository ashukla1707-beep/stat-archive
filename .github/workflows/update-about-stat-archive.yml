name: Update About Stat Archive

on:
  push:
    paths:
      - '.github/workflows/update-about-stat-archive.yml'

permissions:
  contents: write

jobs:
  update-about:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace About modal and styles
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          start_marker = '<div class="overlay" id="aboutArchiveOverlay"'
          start = html.find(start_marker)
          if start < 0:
              raise SystemExit('About overlay start marker not found')
          end = html.find('\n<script', start)
          if end < 0:
              raise SystemExit('About overlay end marker not found')

          new_overlay = '''<div class="overlay" id="aboutArchiveOverlay" role="dialog" aria-modal="true" aria-labelledby="aboutArchiveTitle">
            <div class="form-card about-archive-card about-dual-card">
              <div class="form-header about-dual-header">
                <span class="form-title" id="aboutArchiveTitle">About Stat Archive</span>
                <button type="button" class="close-btn" id="closeAboutArchiveBtn" aria-label="Close About Stat Archive">✕</button>
              </div>
              <div class="about-dual-body">
                <section class="about-info-block about-project-block" aria-labelledby="aboutIdeaHeading">
                  <div class="about-block-label">ABOUT STAT ARCHIVE</div>
                  <h3 id="aboutIdeaHeading">THE IDEA</h3>
                  <p>Stat Archive began with a simple thought: useful academic material should not disappear when one batch graduates. Notes, books and question papers become more valuable when they stay organized, searchable and available to the students who come next.</p>
                </section>

                <section class="about-info-block about-creator-block" aria-labelledby="aboutCreatorHeading">
                  <div class="about-block-label">ABOUT ME · CREATOR</div>
                  <h3 id="aboutCreatorHeading" class="about-creator-name">Adarsh Shukla</h3>
                  <div class="about-creator-role">CREATOR OF STAT ARCHIVE</div>
                  <p>I like building things that solve problems I encounter myself. What started as a small attempt to organize study material gradually became something I wanted to make useful for everyone. I enjoy learning through experimentation — trying an idea, finding what doesn’t work, and improving it until it does.</p>
                  <p>Stat Archive is one of those experiments, and certainly not the last.</p>
                </section>

                <div class="about-dual-signoff">
                  <strong>Stat Archive</strong>
                  <span>LEARN · ANALYZE · GROW</span>
                </div>
              </div>
            </div>
          </div>'''

          html = html[:start] + new_overlay + html[end:]
          index_path.write_text(html, encoding='utf-8')

          css_path = Path('assets/styles.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* ABOUT DUAL BLOCK V1 */'
          block = r'''

/* ABOUT DUAL BLOCK V1 */
#aboutArchiveOverlay .about-dual-card{
  width:min(760px,calc(100vw - 30px));
  max-height:min(88vh,820px);
  padding:0 !important;
  overflow:hidden;
}
#aboutArchiveOverlay .about-dual-header{
  position:sticky;
  top:0;
  z-index:3;
  padding:24px 26px 18px;
  margin:0;
  background:rgba(15,20,29,.96);
  border-bottom:1px solid rgba(148,163,184,.12);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}
#aboutArchiveOverlay .about-dual-body{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  padding:22px 24px 24px;
  max-height:calc(88vh - 82px);
  overflow-y:auto;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}
#aboutArchiveOverlay .about-info-block{
  min-width:0;
  padding:22px 22px 24px;
  border:1px solid rgba(148,163,184,.15);
  border-radius:18px;
  background:linear-gradient(145deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
  box-shadow:inset 0 1px rgba(255,255,255,.025);
}
#aboutArchiveOverlay .about-block-label{
  margin:0 0 18px;
  color:#6f7d91;
  font:700 9.5px/1.2 'JetBrains Mono',monospace;
  letter-spacing:.16em;
}
#aboutArchiveOverlay .about-info-block h3{
  margin:0 0 14px;
  color:var(--text);
  font:700 18px/1.25 'JetBrains Mono',monospace;
  letter-spacing:.04em;
}
#aboutArchiveOverlay .about-info-block p{
  margin:0;
  color:var(--muted);
  font:400 14px/1.85 'Inter',sans-serif;
}
#aboutArchiveOverlay .about-info-block p + p{margin-top:18px;}
#aboutArchiveOverlay .about-creator-name{
  margin-bottom:5px !important;
  font-family:'Plus Jakarta Sans',sans-serif !important;
  font-size:27px !important;
  line-height:1.05 !important;
  letter-spacing:-.035em !important;
}
#aboutArchiveOverlay .about-creator-role{
  margin:0 0 18px;
  color:var(--cyan-2);
  font:700 9px/1.3 'JetBrains Mono',monospace;
  letter-spacing:.14em;
}
#aboutArchiveOverlay .about-dual-signoff{
  grid-column:1/-1;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:16px 2px 0;
  border-top:1px solid rgba(148,163,184,.12);
}
#aboutArchiveOverlay .about-dual-signoff strong{
  color:var(--text);
  font:700 12px 'JetBrains Mono',monospace;
}
#aboutArchiveOverlay .about-dual-signoff span{
  color:#6f7d91;
  font:600 8.5px 'JetBrains Mono',monospace;
  letter-spacing:.12em;
}
body[data-theme="light"] #aboutArchiveOverlay .about-dual-header{
  background:rgba(249,247,240,.97);
  border-bottom-color:#ded8cc;
}
body[data-theme="light"] #aboutArchiveOverlay .about-info-block{
  border-color:#ddd7cb;
  background:linear-gradient(145deg,rgba(255,255,255,.82),rgba(244,240,230,.58));
}
body[data-theme="light"] #aboutArchiveOverlay .about-block-label,
body[data-theme="light"] #aboutArchiveOverlay .about-dual-signoff span{color:#727b75;}
body[data-theme="light"] #aboutArchiveOverlay .about-creator-role{color:#347d73;}
body[data-theme="light"] #aboutArchiveOverlay .about-dual-signoff{border-top-color:#ddd7cb;}
@media(max-width:700px){
  #aboutArchiveOverlay{
    align-items:flex-start !important;
    padding:18px 0 calc(18px + env(safe-area-inset-bottom));
  }
  #aboutArchiveOverlay .about-dual-card{
    width:calc(100vw - 24px);
    max-height:calc(100dvh - 36px);
    border-radius:20px !important;
  }
  #aboutArchiveOverlay .about-dual-header{
    padding:19px 18px 15px;
  }
  #aboutArchiveOverlay .about-dual-header .form-title{
    font-size:18px;
  }
  #aboutArchiveOverlay .about-dual-body{
    grid-template-columns:1fr;
    gap:14px;
    padding:16px 16px 20px;
    max-height:calc(100dvh - 104px);
  }
  #aboutArchiveOverlay .about-info-block{
    padding:19px 18px 21px;
    border-radius:16px;
  }
  #aboutArchiveOverlay .about-block-label{margin-bottom:14px;}
  #aboutArchiveOverlay .about-info-block h3{font-size:16px;margin-bottom:12px;}
  #aboutArchiveOverlay .about-info-block p{font-size:13.5px;line-height:1.78;}
  #aboutArchiveOverlay .about-creator-name{font-size:25px !important;}
  #aboutArchiveOverlay .about-dual-signoff{
    flex-direction:column;
    align-items:flex-start;
    padding:14px 2px 0;
  }
}
'''
          if marker not in css:
              css += block
          else:
              css = css[:css.index(marker)] + block.lstrip('\n')
          css_path.write_text(css, encoding='utf-8')

          sw_path = Path('sw.js')
          sw = sw_path.read_text(encoding='utf-8')
          sw, n = re.subn(r'const CACHE = "[^"]+";', 'const CACHE = "stat-archive-shell-v20260927-about-dual-v1";', sw, count=1)
          if n != 1:
              raise SystemExit('Service worker cache constant not updated')
          sw_path.write_text(sw, encoding='utf-8')

          assert 'THE IDEA' in html
          assert 'ABOUT ME · CREATOR' in html
          assert 'Adarsh Shukla' in html
          assert 'useful academic material should not disappear' in html
          print('About modal updated successfully')
          PY

      - name: Remove one-time workflow and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189823+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-about-stat-archive.yml
          git add index.html assets/styles.css sw.js
          git diff --cached --check
          git commit -m "Redesign About Stat Archive with creator block"
          git push

# trigger-20260927-1
