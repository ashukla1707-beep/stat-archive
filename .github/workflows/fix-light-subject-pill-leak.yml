name: Fix light subject pill leak

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-light-subject-pill-leak.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove light-theme active subject color bleed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/styles.css')
          s = p.read_text(encoding='utf-8')
          marker = '/* Desktop light-theme active subject pill bleed fix */'
          if marker not in s:
              s += '''\n\n/* Desktop light-theme active subject pill bleed fix */\n@media (min-width:701px){\n  body[data-theme="light"] #subjectFilterRow .pill.active{\n    background:#5a3a73!important;\n    border-color:#5a3a73!important;\n    box-shadow:none!important;\n    background-clip:padding-box!important;\n    overflow:hidden!important;\n    isolation:isolate!important;\n  }\n}\n'''
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189823+github-actions[bot]@users.noreply.github.com"
          git add assets/styles.css
          git commit -m "Fix light theme active subject pill color bleed"
          git push origin HEAD:main