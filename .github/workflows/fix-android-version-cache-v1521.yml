name: Fix Android version metadata cache for 1.5.21

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-android-version-cache-v1521.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Android web metadata and cache behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          phone = Path('assets/js/phone-landscape-hero.js')
          s = phone.read_text(encoding='utf-8')
          s = s.replace('const VERSION_URL = "./version.json";', 'const VERSION_URL = "./version.json?v=1.5.21";', 1)
          s = s.replace('let appMeta = { versionName:"1.5.19", versionCode:26, apkUrl:FALLBACK_APK, apkSizeBytes:null };', 'let appMeta = { versionName:"1.5.21", versionCode:28, apkUrl:FALLBACK_APK, apkSizeBytes:null };', 1)
          phone.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          w = sw.read_text(encoding='utf-8')
          w = w.replace('const CACHE = "stat-archive-shell-v20260926-r2-range-preview-v1";', 'const CACHE = "stat-archive-shell-v20260926-android-version-v1521";', 1)
          w = w.replace('const PHONE_LANDSCAPE_HERO_TAG = \'<script src="./assets/js/phone-landscape-hero.js?v=20260916-no-progress-v10"></script>\';', 'const PHONE_LANDSCAPE_HERO_TAG = \'<script src="./assets/js/phone-landscape-hero.js?v=20260926-android-version-v1521"></script>\';', 1)
          marker = "const isDocumentNavigation=request.mode==='navigate';"
          inject = "if(url.origin===self.location.origin&&url.pathname.endsWith('/version.json')){event.respondWith(fetch(new Request(request,{cache:'no-store'})));return;}" + marker
          if "url.pathname.endsWith('/version.json')" not in w:
              w = w.replace(marker, inject, 1)
          sw.write_text(w, encoding='utf-8')
          PY

      - name: Commit web metadata cache fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/phone-landscape-hero.js sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix Android web version cache for 1.5.21"
          git push
