name: Fix Drive streaming v2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-drive-streaming-v2.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          Path('worker.js').write_text('''function cleanFilename(value) {
            const raw = String(value || "Stat Archive file.pdf").replace(/[\\\\/:*?"<>|\\r\\n]+/g, "_").trim();
            return raw || "Stat Archive file.pdf";
          }

          function driveId(raw) {
            const value = String(raw || "").trim();
            const match = value.match(/\\/file\\/d\\/([A-Za-z0-9_-]+)/i)
              || value.match(/[?&]id=([A-Za-z0-9_-]+)/i)
              || value.match(/\\/d\\/([A-Za-z0-9_-]+)/i);
            return match ? match[1] : "";
          }

          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              if (url.pathname === "/drive-file") {
                const id = driveId(url.searchParams.get("id"));
                if (!id) return new Response("Invalid Drive file", { status: 400 });
                const requestedName = cleanFilename(url.searchParams.get("name"));
                const mode = url.searchParams.get("mode") === "download" ? "attachment" : "inline";
                const upstreamUrl = `https://drive.usercontent.google.com/download?id=${encodeURIComponent(id)}&export=download&confirm=t`;
                const upstream = await fetch(upstreamUrl, { method: "GET", redirect: "follow" });
                if (!upstream.ok) return new Response("Drive file unavailable", { status: upstream.status });
                const headers = new Headers();
                headers.set("Content-Type", upstream.headers.get("Content-Type") || "application/octet-stream");
                const length = upstream.headers.get("Content-Length");
                if (length) headers.set("Content-Length", length);
                headers.set("Cache-Control", "private, max-age=0, no-store");
                headers.set("Content-Disposition", `${mode}; filename*=UTF-8''${encodeURIComponent(requestedName)}`);
                headers.set("X-Content-Type-Options", "nosniff");
                return new Response(upstream.body, { status: 200, headers });
              }
              return env.ASSETS.fetch(request);
            }
          };
          ''', encoding='utf-8')

          p=Path('wrangler.jsonc'); cfg=json.loads(p.read_text())
          cfg['main']='worker.js'; cfg.setdefault('assets',{})['binding']='ASSETS'
          p.write_text(json.dumps(cfg,indent=2)+'\n')

          p=Path('assets/js/core.js'); s=p.read_text()
          if 'function statArchiveDriveStreamUrl(' not in s:
              helper='''function archiveDownloadName(entry) {\n  const raw = String(entry?.title || entry?.filename || "Stat Archive file").trim();\n  const extMatch = String(entry?.filename || "").match(/\\.[A-Za-z0-9]{1,8}$/);\n  const ext = extMatch ? extMatch[0] : ".pdf";\n  return /\\.[A-Za-z0-9]{1,8}$/.test(raw) ? raw : raw + ext;\n}\n\nfunction statArchiveDriveStreamUrl(entry, mode = "inline") {\n  const id = typeof googleDriveFileId === "function" ? googleDriveFileId(entry?.driveUrl) : "";\n  if (!id) return "";\n  const name = archiveDownloadName(entry);\n  return `${window.location.origin}/drive-file?id=${encodeURIComponent(id)}&name=${encodeURIComponent(name)}&mode=${mode === "download" ? "download" : "inline"}`;\n}\n\n'''
              s=s.replace('function mapDbEntry(e) {',helper+'function mapDbEntry(e) {',1)
              p.write_text(s)

          p=Path('assets/js/download-fix.js'); s=p.read_text()
          old="""      if (entry?.driveUrl) {\n        const url = typeof googleDriveDownloadUrl === 'function' ? googleDriveDownloadUrl(entry) : entry.driveUrl;\n        const a=document.createElement('a'); a.href=url; a.target='_blank'; a.rel='noopener'; a.download=entry.filename||entry.title||'stat-archive-file.pdf'; document.body.appendChild(a); a.click(); a.remove();\n        try { incrementActivity('download'); } catch (_) {}\n        return;\n      }"""
          new="""      if (entry?.driveUrl) {\n        const url = typeof statArchiveDriveStreamUrl === 'function' ? statArchiveDriveStreamUrl(entry, 'download') : entry.driveUrl;\n        const a = document.createElement('a');\n        a.href = url;\n        a.download = typeof archiveDownloadName === 'function' ? archiveDownloadName(entry) : (entry.title || entry.filename || 'Stat Archive file.pdf');\n        a.style.display = 'none';\n        document.body.appendChild(a);\n        a.click();\n        a.remove();\n        try { incrementActivity('download'); } catch (_) {}\n        return;\n      }"""
          if old not in s: raise SystemExit('download block missing')
          p.write_text(s.replace(old,new,1))

          p=Path('assets/js/offline.js'); s=p.read_text()
          old='''    const fileUrl = entry.driveUrl\n      ? (typeof googleDriveDownloadUrl === "function" ? googleDriveDownloadUrl(entry) : entry.driveUrl)\n      : `${WORKER_URL}/file?id=${encodeURIComponent(entry.id)}`;'''
          new='''    const fileUrl = entry.driveUrl\n      ? (typeof statArchiveDriveStreamUrl === "function" ? statArchiveDriveStreamUrl(entry, "inline") : entry.driveUrl)\n      : `${WORKER_URL}/file?id=${encodeURIComponent(entry.id)}`;'''
          if old not in s: raise SystemExit('offline block missing')
          p.write_text(s.replace(old,new,1))

          p=Path('assets/js/archive-ui.js'); s=p.read_text()
          old='''      <span class="card-type"${isBook && entry.title ? ` data-full-title="${escapeHtml(typeLabel)}" tabindex="0"` : ""}>${escapeHtml(typeLabel)}</span>\n      ${entry.year ? `<span class="card-year">${escapeHtml(entry.year)}</span>` : ""}'''
          new='''      <span class="card-type"${isBook && entry.title ? ` data-full-title="${escapeHtml(typeLabel)}" tabindex="0"` : ""}>${escapeHtml(typeLabel)}</span>\n      ${entry.year ? `<span class="card-year">${escapeHtml(entry.year)}</span>` : ""}\n      ${entry.driveUrl ? `<span class="card-source-badge" title="File hosted on Google Drive">DRIVE</span>` : ""}'''
          if old not in s: raise SystemExit('card meta block missing')
          p.write_text(s.replace(old,new,1))

          p=Path('assets/js/mobile-card-actions.js'); s=p.read_text()
          if '.card-source-badge{' not in s:
              css="""\n.card-source-badge{display:inline-flex;align-items:center;justify-content:center;height:20px;padding:0 7px;border-radius:999px;border:1px solid rgba(99,239,255,.28);background:rgba(99,239,255,.08);color:#75eefa;font:700 9px/1 'JetBrains Mono',monospace;letter-spacing:.08em;white-space:nowrap}\nbody[data-theme=\"light\"] .card-source-badge{border-color:rgba(90,58,115,.24);background:rgba(90,58,115,.08);color:#5a3a73}\n"""
              target='`;\n\n  document.head.appendChild(style);'
              if target not in s: raise SystemExit('style end missing')
              s=s.replace(target,css+target,1)
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189823+github-actions[bot]@users.noreply.github.com"
          git add worker.js wrangler.jsonc assets/js/core.js assets/js/download-fix.js assets/js/offline.js assets/js/archive-ui.js assets/js/mobile-card-actions.js
          git diff --cached --quiet || git commit -m "Fix Drive offline and download naming"
          git push
