name: Patch canonical Android release source once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-android-release-source-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Point Android UI at canonical release metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('assets/js/phone-landscape-hero.js')
          s = p.read_text(encoding='utf-8')
          replacements = [
              (
                  '  const FALLBACK_APK = "./downloads/stat-archive.apk";',
                  '  const FALLBACK_APK = "https://raw.githubusercontent.com/ashukla1707-beep/statarchive-android/main/downloads/stat-archive.apk";'
              ),
              (
                  '  const VERSION_URL = "./version.json?v=1.5.21";',
                  '  const VERSION_URL = "https://raw.githubusercontent.com/ashukla1707-beep/statarchive-android/main/downloads/version.json";'
              ),
              (
                  '  let appMeta = { versionName:"1.5.21", versionCode:28, apkUrl:FALLBACK_APK, apkSizeBytes:null };',
                  '  let appMeta = { versionName:"1.5.25", versionCode:32, apkUrl:FALLBACK_APK, apkSizeBytes:816652 };'
              ),
              (
                  '      const response=await fetch(VERSION_URL,{cache:"no-store"});',
                  '      const response=await fetch(`${VERSION_URL}?t=${Date.now()}`,{cache:"no-store"});'
              ),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Missing expected phone-landscape source: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          w = sw.read_text(encoding='utf-8')
          sw_replacements = [
              (
                  'const CACHE = "stat-archive-shell-v20260927-more-transition-v4";',
                  'const CACHE = "stat-archive-shell-v20260927-android-release-sync-v1";'
              ),
              (
                  'const PHONE_LANDSCAPE_HERO_TAG = \'<script src="./assets/js/phone-landscape-hero.js?v=20260926-android-version-v1521"></script>\';',
                  'const PHONE_LANDSCAPE_HERO_TAG = \'<script src="./assets/js/phone-landscape-hero.js?v=20260927-android-release-sync-v1"></script>\';'
              ),
              (
                  'const SEARCH_FILTER_FIX_TAG = \'<script src="./assets/js/search-filter-fix.js?v=20260905-1"></script>\';',
                  'const SEARCH_FILTER_FIX_TAG = \'<script src="./assets/js/search-filter-fix.js?v=20260927-android-release-sync-v1"></script>\';'
              ),
              (
                  "||url.pathname.endsWith('/assets/js/search-suggestions.js')||url.pathname.endsWith('/assets/js/feature-polish.js')||",
                  "||url.pathname.endsWith('/assets/js/search-suggestions.js')||url.pathname.endsWith('/assets/js/search-filter-fix.js')||url.pathname.endsWith('/assets/js/feature-polish.js')||"
              ),
          ]
          for old, new in sw_replacements:
              if old not in w:
                  raise SystemExit(f'Missing expected service-worker source: {old}')
              w = w.replace(old, new, 1)
          sw.write_text(w, encoding='utf-8')
          PY

      - name: Commit patch and remove one-time workflow
        run: |
          rm -f .github/workflows/patch-android-release-source-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "4189823+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use canonical Android release metadata everywhere"
          git push origin HEAD:main
