name: Fix mu all layers

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-mu-all-layers.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make mu 12px in every rendering layer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # index.html: first raw HTML paint
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('font-size:14px!important;', 'font-size:12px!important;', 1)
          p.write_text(s, encoding='utf-8')

          # hero-layout-fix.js: late injected compatibility CSS + touch-desktop SVG
          p = Path('assets/js/hero-layout-fix.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('font-size:14px !important;', 'font-size:12px !important;')
          s = s.replace('"font-size": 22,', '"font-size": 12,')
          p.write_text(s, encoding='utf-8')

          # sw.js: decorated/cached first-paint HTML guard
          p = Path('sw.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('const CACHE = "stat-archive-shell-v20260913-touch-desktop-firstpaint-v2";',
                        'const CACHE = "stat-archive-shell-v20260913-mu12-consistent-v3";')
          s = s.replace('hero-layout-fix.js?v=20260913-mu-stable-1',
                        'hero-layout-fix.js?v=20260913-mu12-consistent-2')
          s = s.replace('font-size:14px!important;', 'font-size:12px!important;')
          p.write_text(s, encoding='utf-8')

          # Validate the known mu owners.
          index = Path('index.html').read_text(encoding='utf-8')
          hero = Path('assets/js/hero-animation.js').read_text(encoding='utf-8')
          layout = Path('assets/js/hero-layout-fix.js').read_text(encoding='utf-8')
          sw = Path('sw.js').read_text(encoding='utf-8')

          checks = {
            'index initial mu is 12': 'font-size:12px!important;' in index.split('statMuInitialStyle',1)[1].split('</style>',1)[0],
            'hero normal mu is 12': 'normalFontSize: 12' in hero,
            'hero touch-desktop mu is 12': 'touchDesktopFontSize: 12' in hero,
            'layout normal/mobile mu has no 14px': 'font-size:14px !important;' not in layout,
            'layout touch SVG mu has no 22px': '"font-size": 22,' not in layout,
            'layout touch SVG mu is 12': '"font-size": 12,' in layout,
            'service-worker preload guard has no 14px': '.hero-probability .axis-mid{font-family:Arial,Helvetica,sans-serif!important;font-size:14px!important;' not in sw,
            'service-worker preload guard is 12px': '.hero-probability .axis-mid{font-family:Arial,Helvetica,sans-serif!important;font-size:12px!important;' in sw,
            'service-worker cache bumped': 'stat-archive-shell-v20260913-mu12-consistent-v3' in sw,
          }
          failed = [k for k,v in checks.items() if not v]
          if failed:
              raise SystemExit('Mu consistency validation failed:\n- ' + '\n- '.join(failed))
          print('Validated all mu rendering layers at 12px.')
          PY

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189823+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/js/hero-layout-fix.js sw.js
          git commit -m "Keep mu at 12px across all rendering layers"
          git push origin HEAD:main
