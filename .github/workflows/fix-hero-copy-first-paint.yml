name: Fix hero copy first paint

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-hero-copy-first-paint.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keep hero copy and graph spacing stable from first paint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_p = '<p class="sub">A focused academic archive of notes and books, curated specifically for University of Lucknow — organized by subject and kept useful for every batch.</p>'
          new_p = '<p class="sub"><span class="hero-sub-lead">A focused academic archive of notes and books, curated specifically for University of Lucknow</span><span class="hero-sub-tail"> — organized by subject and kept useful for everyone.</span></p>'
          if old_p in s:
              s = s.replace(old_p, new_p, 1)
          else:
              old_everyone = '<p class="sub">A focused academic archive of notes and books, curated specifically for University of Lucknow — organized by subject and kept useful for everyone.</p>'
              if old_everyone in s:
                  s = s.replace(old_everyone, new_p, 1)

          initial_style = '''
<style id="statHeroCopyInitialStyle">
html body .header .hero-line .sub .hero-sub-lead,
html body .header .hero-line .sub .hero-sub-tail{
  background:none!important;background-color:transparent!important;background-image:none!important;
  box-shadow:none!important;border:0!important;width:auto!important;min-width:0!important;
  height:auto!important;min-height:0!important;max-height:none!important;padding:0!important;
  color:inherit!important;-webkit-box-decoration-break:clone!important;box-decoration-break:clone!important;
}
@media (min-width:1101px){
  html body .header .hero-copy{width:58%!important;max-width:850px!important;position:relative!important;z-index:3!important;transform:translateY(-18px)!important;overflow:visible!important}
  html body .header .hero-line{display:flex!important;align-items:flex-start!important;gap:14px!important;width:100%!important;margin-top:18px!important;padding:0!important;overflow:visible!important}
  html body .header .hero-line>span[aria-hidden="true"]{position:static!important;flex:0 0 44px!important;width:44px!important;min-width:44px!important;height:1px!important;margin:10px 0 0!important;padding:0!important;transform:none!important}
  html body .header .hero-line .sub{display:block!important;flex:1 1 auto!important;width:auto!important;max-width:none!important;min-width:0!important;height:auto!important;max-height:none!important;margin:0!important;padding:0!important;overflow:visible!important;white-space:normal!important;font-size:13px!important;line-height:1.58!important;transform:none!important}
  html body .header .hero-sub-lead,html body .header .hero-sub-tail{display:block!important;position:static!important;line-height:1.58!important}
  html body .header .hero-sub-lead{white-space:nowrap!important}
  html body .header .hero-sub-tail{white-space:nowrap!important;margin-top:1px!important}
}
@media (min-width:701px) and (max-width:1100px){
  html body .header .hero-copy{transform:none!important;overflow:visible!important}
  html body .header .hero-line,html body .header .hero-line .sub{height:auto!important;max-height:none!important;overflow:visible!important;white-space:normal!important}
  html body .header .hero-sub-lead,html body .header .hero-sub-tail{display:inline!important;white-space:normal!important;line-height:inherit!important}
}
@media (max-width:700px){
  html body .header .hero-copy{transform:none!important;overflow:visible!important}
  html body .header .hero-line{display:flex!important;align-items:flex-start!important;width:100%!important;overflow:visible!important}
  html body .header .hero-line .sub{display:block!important;width:calc(100% - 41px)!important;max-width:none!important;height:auto!important;max-height:none!important;margin:0!important;padding:0 0 8px!important;overflow:visible!important;white-space:normal!important;line-height:1.6!important}
  html body .header .hero-sub-lead,html body .header .hero-sub-tail{display:inline!important;position:static!important;white-space:normal!important;line-height:inherit!important}
}
</style>
'''
          if 'id="statHeroCopyInitialStyle"' not in s:
              marker = '</style>\n</head>'
              if marker not in s:
                  raise SystemExit('Could not find initial style insertion point in index.html')
              s = s.replace(marker, '</style>\n' + initial_style + '</head>', 1)
          p.write_text(s, encoding='utf-8')

          # Make the late repair idempotent so it does not reconstruct the paragraph
          # after the first frame when the canonical spans are already present.
          p = Path('assets/js/hero-animation.js')
          s = p.read_text(encoding='utf-8')
          old = '''  function repairHeroCopy() {\n    const sub = document.querySelector(".hero-line .sub");\n    if (!sub) return;\n    sub.innerHTML = '<span class="hero-sub-lead">A focused academic archive of notes and books, curated specifically for University of Lucknow</span>' + '<span class="hero-sub-tail"> — organized by subject and kept useful for everyone.</span>';\n  }'''
          new = '''  function repairHeroCopy() {\n    const sub = document.querySelector(".hero-line .sub");\n    if (!sub) return;\n    const lead = sub.querySelector(".hero-sub-lead");\n    const tail = sub.querySelector(".hero-sub-tail");\n    if (lead && tail) {\n      lead.textContent = "A focused academic archive of notes and books, curated specifically for University of Lucknow";\n      tail.textContent = " — organized by subject and kept useful for everyone.";\n      return;\n    }\n    sub.innerHTML = '<span class="hero-sub-lead">A focused academic archive of notes and books, curated specifically for University of Lucknow</span>' + '<span class="hero-sub-tail"> — organized by subject and kept useful for everyone.</span>';\n  }'''
          if old not in s:
              raise SystemExit('Expected repairHeroCopy block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # Keep service-worker served/cached navigation identical to the raw HTML
          # and force old cached first-paint geometry out.
          p = Path('sw.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('const CACHE = "stat-archive-shell-v20260913-mu12-consistent-v3";',
                        'const CACHE = "stat-archive-shell-v20260913-hero-copy-stable-v4";')
          s = s.replace('hero-layout-fix.js?v=20260913-mu12-consistent-2',
                        'hero-layout-fix.js?v=20260913-hero-copy-stable-3')

          needle = '''  out = out.replace(\n    'A focused academic archive of notes and books, curated specifically for University of Lucknow — organized by subject and kept useful for every batch.',\n    'A focused academic archive of notes and books, curated specifically for University of Lucknow — organized by subject and kept useful for everyone.'\n  );'''
          replacement = '''  out = out.replace(\n    '<p class="sub">A focused academic archive of notes and books, curated specifically for University of Lucknow — organized by subject and kept useful for every batch.</p>',\n    '<p class="sub"><span class="hero-sub-lead">A focused academic archive of notes and books, curated specifically for University of Lucknow</span><span class="hero-sub-tail"> — organized by subject and kept useful for everyone.</span></p>'\n  );\n  out = out.replace(\n    '<p class="sub">A focused academic archive of notes and books, curated specifically for University of Lucknow — organized by subject and kept useful for everyone.</p>',\n    '<p class="sub"><span class="hero-sub-lead">A focused academic archive of notes and books, curated specifically for University of Lucknow</span><span class="hero-sub-tail"> — organized by subject and kept useful for everyone.</span></p>'\n  );'''
          if needle not in s:
              raise SystemExit('Expected service-worker hero text replacement not found')
          s = s.replace(needle, replacement, 1)
          p.write_text(s, encoding='utf-8')

          # Validation
          index = Path('index.html').read_text(encoding='utf-8')
          hero = Path('assets/js/hero-animation.js').read_text(encoding='utf-8')
          sw = Path('sw.js').read_text(encoding='utf-8')
          checks = {
              'canonical hero spans are in raw HTML': 'class="hero-sub-lead"' in index and 'class="hero-sub-tail"' in index,
              'first-paint hero layout style exists': 'id="statHeroCopyInitialStyle"' in index,
              'mobile first-paint geometry matches final layout': 'width:calc(100% - 41px)!important' in index and 'padding:0 0 8px!important' in index,
              'late repair is idempotent': 'if (lead && tail)' in hero,
              'service worker normalizes hero spans': 'hero-sub-lead' in sw and 'hero-sub-tail' in sw,
              'service-worker cache bumped': 'stat-archive-shell-v20260913-hero-copy-stable-v4' in sw,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Hero first-paint stability validation failed:\n- ' + '\n- '.join(failed))
          print('Validated hero copy/graph spacing is stable from first paint.')
          PY

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189823+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/js/hero-animation.js sw.js
          git commit -m "Stabilize hero text and graph spacing on refresh"
          git push origin HEAD:main
