name: Fix phone landscape hero

on:
  push:
    paths:
      - '.github/workflows/fix-phone-landscape-hero.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep phone hero stable in landscape
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('assets/js/hero-layout-fix.js')
          s = p.read_text(encoding='utf-8')

          old = '''  function isTouchDesktop() {
            return (navigator.maxTouchPoints || 0) > 0 && window.innerWidth > 700;
          }'''
          new = '''  function isTouchDesktop() {
            const touch = (navigator.maxTouchPoints || 0) > 0;
            const ua = String(navigator.userAgent || "");
            const appLike =
              /(?:;\\s*wv\\)|\\bwv\\b|Version\\/4\\.0)/i.test(ua) ||
              !!window.matchMedia?.("(display-mode: standalone)").matches ||
              !!window.matchMedia?.("(display-mode: fullscreen)").matches;
            const normalPhoneBrowser = /Android/i.test(ua) && /Mobile/i.test(ua);
            const phoneLandscape =
              touch &&
              window.innerWidth > 700 &&
              window.innerHeight <= 700 &&
              (appLike || normalPhoneBrowser);

            /* A real phone becomes wider than 700 CSS px after rotation on some
               Android WebViews/APK wrappers. That must NOT opt into the special
               touch-desktop hero. Browser Desktop-site mode remains eligible. */
            return touch && window.innerWidth > 700 && !phoneLandscape;
          }'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'const phoneLandscape =' not in s:
              raise SystemExit('isTouchDesktop signature changed; refusing blind patch')

          marker = '/* STAT ARCHIVE PHONE LANDSCAPE HERO LOCK v1 */'
          if marker not in s:
              s += r'''

/* STAT ARCHIVE PHONE LANDSCAPE HERO LOCK v1
   Rotation in Android APK / normal phone browser must preserve the mobile
   visual language instead of switching to the laptop hero at width > 700px. */
(() => {
  "use strict";

  const STYLE_ID = "statArchivePhoneLandscapeHeroStyle";
  const ROOT_CLASS = "stat-phone-landscape";

  function isPhoneLandscape() {
    const touch = (navigator.maxTouchPoints || 0) > 0;
    const ua = String(navigator.userAgent || "");
    const appLike =
      /(?:;\s*wv\)|\bwv\b|Version\/4\.0)/i.test(ua) ||
      !!window.matchMedia?.("(display-mode: standalone)").matches ||
      !!window.matchMedia?.("(display-mode: fullscreen)").matches;
    const normalPhoneBrowser = /Android/i.test(ua) && /Mobile/i.test(ua);

    return touch &&
      window.innerWidth > 700 &&
      window.innerHeight <= 700 &&
      (appLike || normalPhoneBrowser);
  }

  function installStyle() {
    if (document.getElementById(STYLE_ID)) return;
    const style = document.createElement("style");
    style.id = STYLE_ID;
    style.textContent = `
html.${ROOT_CLASS} body .header{
  display:block !important;
  position:relative !important;
  height:auto !important;
  min-height:0 !important;
  padding:22px 28px 26px !important;
  overflow:visible !important;
}

html.${ROOT_CLASS} body .header .hero-copy{
  position:relative !important;
  inset:auto !important;
  width:100% !important;
  max-width:none !important;
  min-width:0 !important;
  transform:none !important;
  z-index:4 !important;
}

html.${ROOT_CLASS} body .header .eyebrow{
  width:calc(100% - 58px) !important;
  max-width:100% !important;
  margin:0 0 12px !important;
  white-space:normal !important;
}

html.${ROOT_CLASS} body .header h1{
  margin:0 !important;
  max-width:calc(100% - 58px) !important;
  font-size:clamp(44px,7.1vw,68px) !important;
  line-height:.98 !important;
  letter-spacing:-.055em !important;
  white-space:nowrap !important;
}

html.${ROOT_CLASS} body .header .hero-line{
  width:100% !important;
  max-width:none !important;
  margin-top:16px !important;
  display:flex !important;
  align-items:flex-start !important;
  gap:12px !important;
  transform:none !important;
}

html.${ROOT_CLASS} body .header .hero-line > span{
  flex:0 0 34px !important;
  width:34px !important;
  margin-top:8px !important;
}

html.${ROOT_CLASS} body .header .hero-line .sub{
  display:block !important;
  width:auto !important;
  max-width:min(700px,calc(100% - 46px)) !important;
  margin:0 !important;
  padding:0 !important;
  font-size:clamp(13px,2.25vw,17px) !important;
  line-height:1.55 !important;
  white-space:normal !important;
  overflow:visible !important;
}

html.${ROOT_CLASS} body .header .hero-probability{
  position:relative !important;
  inset:auto !important;
  width:100% !important;
  height:280px !important;
  max-width:none !important;
  margin:24px 0 0 !important;
  transform:none !important;
  overflow:hidden !important;
}

html.${ROOT_CLASS} body .header .hero-probability .probability-svg{
  position:absolute !important;
  left:18px !important;
  right:18px !important;
  top:34px !important;
  width:calc(100% - 36px) !important;
  height:225px !important;
  max-width:none !important;
  transform:none !important;
  display:block !important;
}

html.${ROOT_CLASS} body .header #statTouchDesktopGraph{
  display:none !important;
}

html.${ROOT_CLASS} body .header .hero-probability .axis-mid{
  display:block !important;
  position:absolute !important;
  left:50% !important;
  right:auto !important;
  top:auto !important;
  bottom:7px !important;
  transform:translateX(-50%) !important;
}

html.${ROOT_CLASS} body .header .formula-chip,
html.${ROOT_CLASS} body .header .curve-note{
  display:none !important;
}

html.${ROOT_CLASS} body .header #mainMenuBtn.main-menu-btn{
  position:absolute !important;
  top:22px !important;
  right:24px !important;
  left:auto !important;
  bottom:auto !important;
  width:42px !important;
  min-width:42px !important;
  max-width:42px !important;
  height:42px !important;
  min-height:42px !important;
  max-height:42px !important;
  transform:none !important;
}

html.${ROOT_CLASS} body .header .hero-probability,
html.${ROOT_CLASS} body .header .hero-copy,
html.${ROOT_CLASS} body .header .probability-svg{
  transition:none !important;
}
`;
    document.head.appendChild(style);
  }

  function sync() {
    const active = isPhoneLandscape();
    document.documentElement.classList.toggle(ROOT_CLASS, active);

    /* If rotation previously created the desktop-site replacement graph, remove
       it immediately so the canonical mobile SVG owns the landscape hero. */
    if (active) {
      const replacement = document.getElementById("statTouchDesktopGraph");
      if (replacement) replacement.remove();
      const hero = document.querySelector(".hero-probability");
      hero?.querySelector(".probability-svg")?.style.removeProperty("display");
      hero?.querySelector(".axis-mid")?.style.removeProperty("display");
    }
  }

  installStyle();
  sync();

  let timer = 0;
  const schedule = () => {
    clearTimeout(timer);
    timer = window.setTimeout(sync, 60);
  };

  window.addEventListener("resize", schedule, { passive:true });
  window.addEventListener("orientationchange", schedule, { passive:true });
  window.visualViewport?.addEventListener("resize", schedule, { passive:true });
})();
'''

          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          w = sw.read_text(encoding='utf-8')
          w = re.sub(
              r'const CACHE = "[^"]+";',
              'const CACHE = "stat-archive-shell-v20260914-phone-landscape-hero-v1";',
              w,
              count=1
          )
          w = re.sub(
              r'const HERO_FIX_SCRIPT_TAG = \'<script src="\.\/assets\/js\/hero-layout-fix\.js\?v=[^"]+"></script>\';',
              'const HERO_FIX_SCRIPT_TAG = \'<script src="./assets/js/hero-layout-fix.js?v=20260914-phone-landscape-v1"></script>\';',
              w,
              count=1
          )
          sw.write_text(w, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          if git diff --quiet -- assets/js/hero-layout-fix.js sw.js; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/hero-layout-fix.js sw.js
          git commit -m "Keep APK hero stable on phone rotation"
          git push
