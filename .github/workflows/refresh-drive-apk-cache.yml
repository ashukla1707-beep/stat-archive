name: Refresh Drive APK repair cache

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch service worker cache routing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('sw.js')
          s = p.read_text()
          s = s.replace('const CACHE = "stat-archive-shell-v20260913-mu-light-match-v6";', 'const CACHE = "stat-archive-shell-v20260914-drive-apk-repair-v1";')
          s = s.replace("const DOWNLOAD_FIX_TAG = '<script src=\"./assets/js/download-fix.js?v=20260905-1\"></script>';", "const DOWNLOAD_FIX_TAG = '<script src=\"./assets/js/download-fix.js?v=20260914-drive-apk-repair-v1\"></script>';")
          needle = "    url.pathname.endsWith('/assets/js/preview-state-guard.js') ||\n"
          addition = "    url.pathname.endsWith('/assets/js/download-fix.js') ||\n"
          if addition not in s:
              s = s.replace(needle, needle + addition)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js
          git commit -m "Refresh cache for Drive APK offline repair"
          git push
