name: Fix mu light color

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-mu-light-color.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match light-theme mu to graph curve
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          targets = [
              Path('assets/js/hero-animation.js'),
              Path('assets/js/hero-layout-fix.js'),
              Path('assets/js/action-spacing-fix.js'),
              Path('index.html'),
              Path('sw.js'),
          ]
          changed=[]
          for p in targets:
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              ns=s.replace('#2f8f5b', '#347d73').replace('#2F8F5B', '#347d73')
              if ns != s:
                  p.write_text(ns, encoding='utf-8')
                  changed.append(str(p))

          # Force the canonical hero animation owner to the exact curve color.
          p=Path('assets/js/hero-animation.js')
          s=p.read_text(encoding='utf-8')
          if 'lightColor: "#347d73"' not in s:
              raise SystemExit('hero-animation light mu color was not updated')

          # The light-theme curve itself uses the archive teal family; use the same canonical color.
          # Validate no stale green remains in known mu owners.
          stale=[]
          for p in targets:
              if p.exists() and '#2f8f5b' in p.read_text(encoding='utf-8').lower():
                  stale.append(str(p))
          if stale:
              raise SystemExit('stale mu green remains in: ' + ', '.join(stale))

          # Bump app-shell cache so cached first-paint styling cannot keep the old green.
          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          import re
          s=re.sub(r'const CACHE = "stat-archive-shell-[^"]+";',
                   'const CACHE = "stat-archive-shell-v20260913-mu-light-match-v6";', s, count=1)
          p.write_text(s,encoding='utf-8')
          changed.append('sw.js')
          print('Updated:', ', '.join(sorted(set(changed))))
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189823+github-actions[bot]@users.noreply.github.com"
          git add assets/js/hero-animation.js assets/js/hero-layout-fix.js assets/js/action-spacing-fix.js index.html sw.js
          git commit -m "Match light theme mu color to graph curve"
          git push origin HEAD:main
