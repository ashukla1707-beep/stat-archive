name: Apply menu level state fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-menu-level-state-fix-2026-09-27.yml'

permissions:
  contents: write

jobs:
  patch-test-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply minimal state-preserving fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          core = Path('assets/js/core.js')
          text = core.read_text(encoding='utf-8')
          old = 'window.history.replaceState({ level: value }, "", url.href);'
          new = 'window.history.replaceState({ ...(window.history.state || {}), level: value }, "", url.href);'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one old setLevelUI history replacement, found {text.count(old)}')
          core.write_text(text.replace(old, new, 1), encoding='utf-8')

          sw = Path('sw.js')
          sw_text = sw.read_text(encoding='utf-8')
          old_cache = 'const CACHE = "stat-archive-shell-v20260926-android-version-v1521";'
          new_cache = 'const CACHE = "stat-archive-shell-v20260927-menu-level-state-v1";'
          if sw_text.count(old_cache) != 1:
              raise SystemExit(f'Expected exactly one old service-worker cache version, found {sw_text.count(old_cache)}')
          sw.write_text(sw_text.replace(old_cache, new_cache, 1), encoding='utf-8')
          PY

      - name: Verify exact patch
        run: |
          grep -F 'window.history.replaceState({ ...(window.history.state || {}), level: value }, "", url.href);' assets/js/core.js
          grep -F 'const CACHE = "stat-archive-shell-v20260927-menu-level-state-v1";' sw.js

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Test menu and hero level switching
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/statarchive-level-test.log 2>&1 &
          sleep 1

          cat > /tmp/menu-level-test.cjs <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless:true });
            const context = await browser.newContext({
              viewport:{ width:390, height:844 },
              reducedMotion:'reduce',
              serviceWorkers:'block'
            });
            const page = await context.newPage();
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(String(error)));

            await page.route('https://stat-archive-api.lustats.workers.dev/**', async route => {
              const url = new URL(route.request().url());
              const level = url.searchParams.get('level') === 'bsc' ? 'bsc' : 'msc';

              if (url.pathname.endsWith('/entries')) {
                const entries = level === 'bsc'
                  ? [{id:'bsc-entry',title:'BSc Menu Test Entry',subject:'BSC_TEST',type:'Notes',year:'2026',filename:'bsc.pdf',size:1000,uploadedAt:'2026-09-27T00:00:00Z'}]
                  : [{id:'msc-entry',title:'MSc Menu Test Entry',subject:'MSC_TEST',type:'Notes',year:'2026',filename:'msc.pdf',size:1000,uploadedAt:'2026-09-27T00:00:00Z'}];
                await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({entries})});
                return;
              }

              if (url.pathname.endsWith('/subjects')) {
                const subjects = level === 'bsc'
                  ? [{id:'bsc-test',code:'BSC_TEST',name:'BSc Menu Test Subject'}]
                  : [{id:'msc-test',code:'MSC_TEST',name:'MSc Menu Test Subject'}];
                await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({subjects})});
                return;
              }

              await route.fulfill({status:200,contentType:'application/json',body:'{}'});
            });

            await page.goto('http://127.0.0.1:4173/index.html?level=msc', {
              waitUntil:'domcontentloaded', timeout:30000
            });
            await page.waitForFunction(() => !!window.__statArchiveNavigation, null, {timeout:15000});
            await page.waitForFunction(() => document.querySelector('#subjectFilterRow')?.textContent?.includes('MSc Menu Test Subject'), null, {timeout:15000});

            async function snapshot() {
              return page.evaluate(() => ({
                level:new URL(location.href).searchParams.get('level'),
                nav:window.__statArchiveNavigation?.state?.(),
                menuOpen:document.getElementById('mainSideMenu')?.classList.contains('is-open'),
                subjectText:document.querySelector('#subjectFilterRow')?.textContent || '',
                mscHero:document.getElementById('levelMscBtn')?.getAttribute('aria-pressed'),
                bscHero:document.getElementById('levelBscBtn')?.getAttribute('aria-pressed'),
                mscMenu:document.getElementById('menuMscLevelBtn')?.getAttribute('aria-pressed'),
                bscMenu:document.getElementById('menuBscLevelBtn')?.getAttribute('aria-pressed'),
                state:{...(history.state || {})}
              }));
            }

            // M.Sc -> Menu -> B.Sc -> close Menu. The selected level must survive Back.
            await page.click('#mainMenuBtn');
            await page.waitForSelector('#mainSideMenu.is-open');
            let s = await snapshot();
            if (s.nav !== 'menu') throw new Error('Expected canonical Menu state before B.Sc switch: '+JSON.stringify(s));

            await page.click('#menuBscLevelBtn');
            await page.waitForFunction(() => new URL(location.href).searchParams.get('level') === 'bsc');
            await page.waitForFunction(() => document.querySelector('#subjectFilterRow')?.textContent?.includes('BSc Menu Test Subject'), null, {timeout:10000});
            s = await snapshot();
            if (s.nav !== 'menu' || s.state.statArchiveNav !== 'menu' || s.state.level !== 'bsc' || s.bscHero !== 'true' || s.bscMenu !== 'true') {
              throw new Error('B.Sc Menu switch lost navigation/level synchronization: '+JSON.stringify(s));
            }

            await page.click('#mainMenuCloseBtn');
            await page.waitForFunction(() => window.__statArchiveNavigation?.state?.() === 'home');
            await page.waitForFunction(() => !document.getElementById('mainSideMenu')?.classList.contains('is-open'));
            s = await snapshot();
            if (s.level !== 'bsc' || !s.subjectText.includes('BSc Menu Test Subject') || s.subjectText.includes('MSc Menu Test Subject') || s.bscHero !== 'true') {
              throw new Error('B.Sc did not survive Menu close: '+JSON.stringify(s));
            }

            // B.Sc -> Menu -> M.Sc -> close Menu.
            await page.click('#mainMenuBtn');
            await page.waitForSelector('#mainSideMenu.is-open');
            await page.click('#menuMscLevelBtn');
            await page.waitForFunction(() => new URL(location.href).searchParams.get('level') === 'msc');
            await page.waitForFunction(() => document.querySelector('#subjectFilterRow')?.textContent?.includes('MSc Menu Test Subject'), null, {timeout:10000});
            s = await snapshot();
            if (s.nav !== 'menu' || s.state.statArchiveNav !== 'menu' || s.state.level !== 'msc' || s.mscHero !== 'true' || s.mscMenu !== 'true') {
              throw new Error('M.Sc Menu switch lost navigation/level synchronization: '+JSON.stringify(s));
            }

            await page.click('#mainMenuCloseBtn');
            await page.waitForFunction(() => window.__statArchiveNavigation?.state?.() === 'home');
            s = await snapshot();
            if (s.level !== 'msc' || !s.subjectText.includes('MSc Menu Test Subject') || s.subjectText.includes('BSc Menu Test Subject') || s.mscHero !== 'true') {
              throw new Error('M.Sc did not survive Menu close: '+JSON.stringify(s));
            }

            // Existing hero control must still switch normally.
            await page.click('#levelBscBtn');
            await page.waitForFunction(() => new URL(location.href).searchParams.get('level') === 'bsc');
            await page.waitForFunction(() => document.querySelector('#subjectFilterRow')?.textContent?.includes('BSc Menu Test Subject'), null, {timeout:10000});
            s = await snapshot();
            if (s.level !== 'bsc' || s.bscHero !== 'true') {
              throw new Error('Hero level switch regressed: '+JSON.stringify(s));
            }

            if (pageErrors.length) console.log('Non-fatal page errors:', pageErrors);
            console.log('PASS: Menu B.Sc/M.Sc switching survives Menu close and hero switching still works.');
            await context.close();
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

          node /tmp/menu-level-test.cjs

      - name: Publish tested fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/core.js sw.js
          git rm .github/workflows/apply-menu-level-state-fix-2026-09-27.yml
          git commit -m "Fix Menu M.Sc B.Sc level switching"
          git push origin HEAD:main
