name: Validate Stat Archive

on:
  push:
    branches:
      - main
      - cleanup/refactor-2026-09-10
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check sw.js
          find assets/js -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Validate JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('version.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('.well-known/assetlinks.json','utf8'))"

      - name: Verify local runtime references exist
        run: |
          python3 - <<'PY'
          from collections import defaultdict
          from pathlib import Path
          import re

          root = Path('.')
          source_files = [Path('index.html'), Path('sw.js')]
          source_files += sorted(Path('assets/js').glob('*.js'))
          source_files += sorted(Path('assets').glob('*.css'))

          refs = defaultdict(set)
          asset_ext = r'(?:js|css|json|png|jpe?g|webp|svg|gif|ico|pdf|apk|woff2?|ttf)'

          def add_ref(raw_ref, source):
              ref = raw_ref.split('?', 1)[0].split('#', 1)[0].strip()
              if ref:
                  refs[ref].add(source.as_posix())

          for source in source_files:
              text = source.read_text(encoding='utf-8')

              for ref in re.findall(
                  rf'''(?:src|href)\s*=\s*["'](?:\./)?([^"'#?]+\.{asset_ext})(?:[?#][^"']*)?["']''',
                  text,
                  flags=re.I,
              ):
                  add_ref(ref, source)

              for ref in re.findall(
                  rf'''["']((?:\./)?(?:assets|icons|downloads|manuals)/[^"'?#]+\.{asset_ext})(?:[?#][^"']*)?["']''',
                  text,
                  flags=re.I,
              ):
                  add_ref(ref, source)

              if source.suffix == '.css':
                  for ref in re.findall(r'''@import\s+(?:url\()?\s*["']?([^"')\s;]+)''', text, flags=re.I):
                      if ref.startswith(('http://', 'https://', 'data:')):
                          continue
                      local_ref = source.parent / ref.split('?', 1)[0].split('#', 1)[0]
                      add_ref(local_ref.as_posix(), source)

          missing = []
          for ref, sources in sorted(refs.items()):
              if ref.startswith(('http://', 'https://', 'data:', 'mailto:', 'tel:')):
                  continue
              path = root / ref.lstrip('/')
              if not path.exists():
                  missing.append((ref, sorted(sources)))

          if missing:
              lines = ['Missing local runtime references:']
              for ref, sources in missing:
                  lines.append(f'- {ref} <- {", ".join(sources)}')
              raise SystemExit('\n'.join(lines))

          print(f'Validated {len(refs)} local/runtime references across HTML, SW, JS, and CSS.')
          PY
