name: Validate Stat Archive

on:
  push:
    branches:
      - main
      - cleanup/refactor-2026-09-10
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check sw.js
          find assets/js -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Validate JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('version.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('.well-known/assetlinks.json','utf8'))"

      - name: Verify local runtime references exist
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          source_files = [Path('index.html'), Path('sw.js')]
          source_files += sorted(Path('assets/js').glob('*.js'))
          source_files += sorted(Path('assets').glob('*.css'))

          refs = set()
          asset_ext = r'(?:js|css|json|png|jpe?g|webp|svg|gif|ico|pdf|apk|woff2?|ttf)'

          for source in source_files:
              text = source.read_text(encoding='utf-8')

              # HTML/script-style src/href references.
              refs.update(re.findall(
                  rf'''(?:src|href)\s*=\s*["'](?:\./)?([^"'#?]+\.{asset_ext})(?:[?#][^"']*)?["']''',
                  text,
                  flags=re.I,
              ))

              # Dynamic JS strings such as script.src = 'assets/js/foo.js?v=1'.
              refs.update(re.findall(
                  rf'''["']((?:\./)?(?:assets|icons|downloads|manuals)/[^"'?#]+\.{asset_ext})(?:[?#][^"']*)?["']''',
                  text,
                  flags=re.I,
              ))

              # Relative CSS imports such as @import "./scanner-base.css".
              if source.suffix == '.css':
                  for ref in re.findall(r'''@import\s+(?:url\()?\s*["']?([^"')\s;]+)''', text, flags=re.I):
                      if ref.startswith(('http://', 'https://', 'data:')):
                          continue
                      refs.add(str((source.parent / ref.split('?', 1)[0].split('#', 1)[0]).as_posix()))

          missing = []
          checked = set()
          for raw_ref in sorted(refs):
              ref = raw_ref.split('?', 1)[0].split('#', 1)[0].strip()
              if not ref or ref in checked:
                  continue
              checked.add(ref)
              if ref.startswith(('http://', 'https://', 'data:', 'mailto:', 'tel:')):
                  continue
              path = root / ref.lstrip('/')
              if not path.exists():
                  missing.append(ref)

          if missing:
              raise SystemExit('Missing local runtime references:\n' + '\n'.join(missing))

          print(f'Validated {len(checked)} local/runtime references across HTML, SW, JS, and CSS.')
          PY
