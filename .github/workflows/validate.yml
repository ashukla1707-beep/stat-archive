name: Validate Stat Archive

on:
  push:
    branches:
      - main
      - cleanup/refactor-2026-09-10
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check sw.js
          find assets/js -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Validate JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('version.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('.well-known/assetlinks.json','utf8'))"

      - name: Verify local runtime references exist
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          index = Path('index.html').read_text(encoding='utf-8')
          sw = Path('sw.js').read_text(encoding='utf-8')

          refs = set()
          refs.update(re.findall(r'''(?:src|href)=["'](?:\./)?([^"'#?]+)["']''', index))
          refs.update(re.findall(r'''["']\./([^"']+)["']''', sw))

          missing = []
          for ref in sorted(refs):
              if ref.startswith(('http://', 'https://', 'data:', 'mailto:', 'tel:')):
                  continue
              path = root / ref.lstrip('/')
              if not path.exists():
                  missing.append(ref)

          if missing:
              raise SystemExit('Missing local runtime references:\n' + '\n'.join(missing))

          print(f'Validated {len(refs)} local/runtime references.')
          PY
