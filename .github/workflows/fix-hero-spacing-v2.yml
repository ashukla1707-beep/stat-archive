name: Fix hero spacing v2

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-hero-spacing-v2.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<p class="sub">A focused academic archive of notes and books, curated specifically for University of Lucknow — organized by subject and kept useful for every batch.</p>','<p class="sub"><span class="hero-sub-lead">A focused academic archive of notes and books, curated specifically for University of Lucknow</span><span class="hero-sub-tail"> — organized by subject and kept useful for everyone.</span></p>',1)
          s=s.replace('<p class="sub">A focused academic archive of notes and books, curated specifically for University of Lucknow — organized by subject and kept useful for everyone.</p>','<p class="sub"><span class="hero-sub-lead">A focused academic archive of notes and books, curated specifically for University of Lucknow</span><span class="hero-sub-tail"> — organized by subject and kept useful for everyone.</span></p>',1)
          if 'id="statHeroCopyInitialStyle"' not in s:
              css='''<style id="statHeroCopyInitialStyle">html body .header .hero-line .sub .hero-sub-lead,html body .header .hero-line .sub .hero-sub-tail{background:none!important;background-color:transparent!important;background-image:none!important;box-shadow:none!important;border:0!important;width:auto!important;min-width:0!important;height:auto!important;min-height:0!important;max-height:none!important;padding:0!important;color:inherit!important}@media(max-width:700px){html body .header .hero-copy{transform:none!important;overflow:visible!important}html body .header .hero-line{display:flex!important;align-items:flex-start!important;width:100%!important;overflow:visible!important}html body .header .hero-line .sub{display:block!important;width:calc(100% - 41px)!important;max-width:none!important;height:auto!important;max-height:none!important;margin:0!important;padding:0 0 8px!important;overflow:visible!important;white-space:normal!important;line-height:1.6!important}html body .header .hero-sub-lead,html body .header .hero-sub-tail{display:inline!important;position:static!important;white-space:normal!important;line-height:inherit!important}}</style>'''
              s=s.replace('</head>',css+'\n</head>',1)
          p.write_text(s)

          p=Path('sw.js')
          s=p.read_text()
          s=s.replace('const CACHE = "stat-archive-shell-v20260913-mu12-consistent-v3";','const CACHE = "stat-archive-shell-v20260913-hero-spacing-v4";')
          s=s.replace('const CACHE = "stat-archive-shell-v20260913-hero-copy-stable-v4";','const CACHE = "stat-archive-shell-v20260913-hero-spacing-v4";')
          p.write_text(s)
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189823+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Keep hero text and graph spacing stable on refresh"
          git push origin HEAD:main
