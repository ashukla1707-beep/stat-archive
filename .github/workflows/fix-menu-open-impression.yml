name: Unify menu card hover feedback
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-menu-open-impression.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply consistent menu hover styles
        shell: python
        run: |
          from pathlib import Path
          p = Path('assets/styles.css')
          s = p.read_text(encoding='utf-8')
          css = '''\n\n/* Consistent menu card hover feedback: match the Android installer card. */\n@media (hover:hover) and (pointer:fine){\n  html body #mainSideMenu .main-menu-action:hover,\n  html body #mainSideMenu .main-menu-theme-btn:hover,\n  html body #mainSideMenu .mobile-menu-level-btn:hover,\n  html body #mainSideMenu #menuOfflineLibraryBtn:hover,\n  html body #mainSideMenu #menuManualsBtn:hover,\n  html body #mainSideMenu #menuAboutBtn:hover,\n  html body #mainSideMenu #menuLocalFeedbackBtn:hover,\n  html body #mainSideMenu #menuAndroidAppBtn:hover{\n    background:rgba(94,231,247,.045)!important;\n    border-color:rgba(94,231,247,.24)!important;\n    transform:none!important;\n    box-shadow:none!important;\n  }\n\n  html body[data-theme=\"light\"] #mainSideMenu .main-menu-action:hover,\n  html body[data-theme=\"light\"] #mainSideMenu .main-menu-theme-btn:hover,\n  html body[data-theme=\"light\"] #mainSideMenu .mobile-menu-level-btn:hover,\n  html body[data-theme=\"light\"] #mainSideMenu #menuOfflineLibraryBtn:hover,\n  html body[data-theme=\"light\"] #mainSideMenu #menuManualsBtn:hover,\n  html body[data-theme=\"light\"] #mainSideMenu #menuAboutBtn:hover,\n  html body[data-theme=\"light\"] #mainSideMenu #menuLocalFeedbackBtn:hover,\n  html body[data-theme=\"light\"] #mainSideMenu #menuAndroidAppBtn:hover{\n    background:rgba(75,54,95,.055)!important;\n    border-color:rgba(75,54,95,.20)!important;\n    transform:none!important;\n    box-shadow:none!important;\n  }\n}\n'''
          marker = 'Consistent menu card hover feedback: match the Android installer card.'
          if marker not in s:
              p.write_text(s + css, encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189823+github-actions[bot]@users.noreply.github.com"
          git add assets/styles.css
          git diff --cached --quiet || git commit -m "Unify menu card hover feedback"
          git push origin HEAD:main
