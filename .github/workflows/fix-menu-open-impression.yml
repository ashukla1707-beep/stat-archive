name: Restore download status
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-menu-open-impression.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Download -> Downloading -> Downloaded state
        shell: python
        run: |
          from pathlib import Path
          import re

          # Card render: persisted downloads must look exactly like Offline's saved state.
          p=Path('assets/js/archive-ui.js')
          s=p.read_text(encoding='utf-8')
          old='''  <button\n    class="action-btn dl-btn${downloadedEntryIds.has(String(entry.id)) ? " is-downloaded" : ""}"\n  >\n    ⬇ Download\n  </button>'''
          new='''  <button\n    class="action-btn dl-btn${downloadedEntryIds.has(String(entry.id)) ? " is-downloaded" : ""}"\n    title="${downloadedEntryIds.has(String(entry.id)) ? "Already downloaded on this device" : "Download file"}"\n  >\n    ${downloadedEntryIds.has(String(entry.id)) ? "✓ Downloaded" : "⬇ Download"}\n  </button>'''
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('archive download button anchor not found')
          p.write_text(s,encoding='utf-8')

          # Reliability layer: show Downloading while active and only persist Downloaded after success.
          p=Path('assets/js/download-fix.js')
          s=p.read_text(encoding='utf-8')
          anchor='''  async function downloadDriveEntry(entry, btn) {'''
          helper='''  function markDownloadComplete(entry, btn) {\n    try {\n      if (btn) {\n        btn.classList.add("is-downloaded");\n        btn.disabled = false;\n        btn.textContent = "✓ Downloaded";\n        btn.setAttribute("title", "Already downloaded on this device");\n      }\n      if (typeof downloadedEntryIds !== "undefined") {\n        downloadedEntryIds.add(String(entry.id));\n        if (typeof saveEntryActionHistory === "function") {\n          saveEntryActionHistory("statArchiveDownloadedEntries", downloadedEntryIds);\n        }\n      }\n    } catch (_) {}\n  }\n\n  async function downloadDriveEntry(entry, btn) {'''
          if 'function markDownloadComplete(entry, btn)' not in s:
              if anchor not in s: raise SystemExit('download helper anchor not found')
              s=s.replace(anchor,helper,1)

          # Mark successful paths. For Android picker/native download, success means handoff accepted.
          s=s.replace('''        try { window.incrementActivity?.("download"); } catch (_) {}\n        return;''','''        try { window.incrementActivity?.("download"); } catch (_) {}\n        markDownloadComplete(entry, btn);\n        return;''')
          s=s.replace('''      try { window.incrementActivity?.("download"); } catch (_) {}\n    } catch (err) {''','''      try { window.incrementActivity?.("download"); } catch (_) {}\n      markDownloadComplete(entry, btn);\n    } catch (err) {''')

          # Offline-preview download is also a successful download action.
          s=s.replace('''      try { await downloadOfflinePreviewBlob(entry, btn); }\n      catch (err) { window.showError?.(err?.message || "Couldn't download that file."); }\n      return;''','''      try {\n        await downloadOfflinePreviewBlob(entry, btn);\n        markDownloadComplete(entry, btn);\n      } catch (err) {\n        window.showError?.(err?.message || "Couldn't download that file.");\n      }\n      return;''')

          # Do not mark a click as downloaded before the transfer succeeds.
          old_block='''    try {\n      btn.classList.add("is-downloaded");\n      if (typeof downloadedEntryIds !== "undefined") {\n        downloadedEntryIds.add(String(entry.id));\n        if (typeof saveEntryActionHistory === "function") {\n          saveEntryActionHistory("statArchiveDownloadedEntries", downloadedEntryIds);\n        }\n      }\n    } catch (_) {}\n\n    reliableDownloadEntry(entry, btn);'''
          if old_block in s: s=s.replace(old_block,'    reliableDownloadEntry(entry, btn);',1)

          # Finally blocks must not overwrite the completed state.
          s=s.replace('''      if (btn) {\n        btn.disabled = false;\n        if (originalHtml) btn.innerHTML = originalHtml;\n        else btn.textContent = originalText || "⬇ Download";\n      }''','''      if (btn && !btn.classList.contains("is-downloaded")) {\n        btn.disabled = false;\n        if (originalHtml) btn.innerHTML = originalHtml;\n        else btn.textContent = originalText || "⬇ Download";\n      }''')
          p.write_text(s,encoding='utf-8')

          # Force the live web/PWA shell to pick up the state fix immediately.
          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'const CACHE = "stat-archive-shell-[^"]+";', 'const CACHE = "stat-archive-shell-v20260915-download-status-v1";', s, count=1)
          s=re.sub(r'const DOWNLOAD_FIX_TAG = .*?;', 'const DOWNLOAD_FIX_TAG = \'<script src="./assets/js/download-fix.js?v=20260915-download-status-v1"></script>\';', s, count=1)
          s=re.sub(r'const ACTION_SPACING_FIX_TAG = .*?;', 'const ACTION_SPACING_FIX_TAG = \'<script src="./assets/js/action-spacing-fix.js?v=20260915-download-status-v1"></script>\';', s, count=1)
          p.write_text(s,encoding='utf-8')

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189823+github-actions[bot]@users.noreply.github.com"
          git add assets/js/archive-ui.js assets/js/download-fix.js sw.js
          git diff --cached --quiet || git commit -m "Restore persistent download status like Offline"
          git push origin HEAD:main