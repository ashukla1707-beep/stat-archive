name: Fix Android hover color in light mode
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-menu-open-impression.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix light theme Android hover
        shell: python
        run: |
          from pathlib import Path

          p = Path('assets/js/phone-landscape-hero.js')
          s = p.read_text(encoding='utf-8')

          dark_rule = 'html body #mainSideMenu #menuAndroidAppBtn.stat-android-card:hover{background:rgba(94,231,247,.045)!important;border-color:rgba(94,231,247,.24)!important;}'
          light_rule = 'body[data-theme=\'light\'] #mainSideMenu #menuAndroidAppBtn.stat-android-card:hover{background:rgba(75,54,95,.055)!important;border-color:rgba(75,54,95,.20)!important;}'

          if light_rule not in s:
              if dark_rule not in s:
                  raise SystemExit('Android hover rule not found')
              s = s.replace(dark_rule, dark_rule + '\n' + light_rule, 1)
              p.write_text(s, encoding='utf-8')

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189823+github-actions[bot]@users.noreply.github.com"
          git add assets/js/phone-landscape-hero.js
          git diff --cached --quiet || git commit -m "Fix Android hover color in light mode"
          git push origin HEAD:main
