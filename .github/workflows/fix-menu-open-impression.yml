name: Add real download progress
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-menu-open-impression.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add byte-accurate download progress
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('assets/js/download-fix.js')
          s=p.read_text(encoding='utf-8')

          anchor='''  function markDownloadComplete(entry, btn) {'''
          helper=r'''  function formatDownloadBytes(bytes) {
    const n = Number(bytes) || 0;
    if (n < 1000) return `${n} B`;
    if (n < 1000000) return `${(n / 1000).toFixed(n < 10000 ? 1 : 0)} KB`;
    return `${(n / 1000000).toFixed(n < 10000000 ? 1 : 0)} MB`;
  }

  function updateDownloadProgress(btn, loaded, total) {
    if (!btn) return;
    btn.disabled = true;
    btn.classList.add("is-downloading");
    if (Number.isFinite(total) && total > 0) {
      const pct = Math.max(0, Math.min(100, Math.round((loaded / total) * 100)));
      btn.textContent = `Downloading… ${pct}%`;
      btn.setAttribute("aria-valuenow", String(pct));
      btn.setAttribute("aria-valuemin", "0");
      btn.setAttribute("aria-valuemax", "100");
      btn.setAttribute("title", `${formatDownloadBytes(loaded)} of ${formatDownloadBytes(total)}`);
    } else {
      btn.textContent = `Downloading… ${formatDownloadBytes(loaded)}`;
      btn.removeAttribute("aria-valuenow");
      btn.setAttribute("title", `${formatDownloadBytes(loaded)} downloaded`);
    }
  }

  async function responseBlobWithProgress(response, btn) {
    const totalHeader = response.headers.get("content-length");
    const total = totalHeader && /^\d+$/.test(totalHeader) ? Number(totalHeader) : 0;
    if (!response.body || typeof response.body.getReader !== "function") {
      if (btn) btn.textContent = "Downloading…";
      return response.blob();
    }
    const reader = response.body.getReader();
    const chunks = [];
    let loaded = 0;
    updateDownloadProgress(btn, 0, total);
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      if (value && value.byteLength) {
        chunks.push(value);
        loaded += value.byteLength;
        updateDownloadProgress(btn, loaded, total);
      }
    }
    if (total > 0) updateDownloadProgress(btn, total, total);
    return new Blob(chunks, { type: response.headers.get("content-type") || "application/octet-stream" });
  }

  function clearDownloadProgress(btn) {
    if (!btn) return;
    btn.classList.remove("is-downloading");
    btn.removeAttribute("aria-valuenow");
    btn.removeAttribute("aria-valuemin");
    btn.removeAttribute("aria-valuemax");
  }

  function markDownloadComplete(entry, btn) {'''
          if 'async function responseBlobWithProgress(response, btn)' not in s:
              if anchor not in s: raise SystemExit('progress helper anchor missing')
              s=s.replace(anchor,helper,1)

          # Completion clears transient progress metadata.
          s=s.replace('''      if (btn) {
        btn.classList.add("is-downloaded");''','''      if (btn) {
        clearDownloadProgress(btn);
        btn.classList.add("is-downloaded");''',1)

          # APK must use the controlled fetch path too; native URL handoff cannot expose live bytes.
          start=s.find('''      /* Current APK: open Android's Save As picker first''')
          end=s.find('''      const response = await nativeFetch()(inlineUrl, {''', start)
          if start >= 0 and end > start:
              s=s[:start] + '''      /* Keep the network transfer inside Stat Archive so web and APK can\n         report real byte progress. Saving/handoff happens only after 100%. */\n''' + s[end:]

          # Both network paths now consume streams with real progress.
          s=s.replace('''      const raw = await response.blob();''','''      const raw = await responseBlobWithProgress(response, btn);''',1)
          # second non-Drive response.blob occurrence
          s=s.replace('''      const blob = await response.blob();''','''      const blob = await responseBlobWithProgress(response, btn);''',1)

          # Failed/cancelled transfers restore normal state cleanly.
          s=s.replace('''      if (btn && !btn.classList.contains("is-downloaded")) {
        btn.disabled = false;''','''      if (btn && !btn.classList.contains("is-downloaded")) {
        clearDownloadProgress(btn);
        btn.disabled = false;''')

          # Capture Android clicks too: the same controlled implementation owns status there.
          s=s.replace('''  document.addEventListener("click", event => {
    if (isAndroid()) return;

    const btn =''','''  document.addEventListener("click", event => {
    const btn =''',1)
          p.write_text(s,encoding='utf-8')

          # Cache bust the runtime so deployed web/PWA/APK receives this implementation.
          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'const CACHE = "stat-archive-shell-[^"]+";', 'const CACHE = "stat-archive-shell-v20260915-real-progress-v1";', s, count=1)
          s=re.sub(r'const DOWNLOAD_FIX_TAG = .*?;', 'const DOWNLOAD_FIX_TAG = \'<script src="./assets/js/download-fix.js?v=20260915-real-progress-v1"></script>\';', s, count=1)
          p.write_text(s,encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189823+github-actions[bot]@users.noreply.github.com"
          git add assets/js/download-fix.js sw.js
          git diff --cached --quiet || git commit -m "Show real byte download progress on web and APK"
          git push origin HEAD:main