name: Fix menu open impression
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-menu-open-impression.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply menu open-state style
        shell: python
        run: |
          from pathlib import Path
          p = Path('assets/styles.css')
          s = p.read_text(encoding='utf-8')
          css = '''\n\n/* Remove touch pressed/focus impression while menu is open. */\n@media (pointer:coarse){\n  html body #mainMenuBtn.main-menu-btn[aria-expanded="true"],\n  html body #mainMenuBtn.main-menu-btn[aria-expanded="true"]:hover,\n  html body #mainMenuBtn.main-menu-btn[aria-expanded="true"]:active,\n  html body #mainMenuBtn.main-menu-btn[aria-expanded="true"]:focus,\n  html body #mainMenuBtn.main-menu-btn[aria-expanded="true"]:focus-visible{\n    background:transparent!important;\n    box-shadow:none!important;\n    filter:none!important;\n    outline:none!important;\n  }\n}\n'''
          if 'Remove touch pressed/focus impression while menu is open.' not in s:
              p.write_text(s + css, encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189823+github-actions[bot]@users.noreply.github.com"
          git add assets/styles.css
          git diff --cached --quiet || git commit -m "Remove menu button impression while open"
          git push origin HEAD:main