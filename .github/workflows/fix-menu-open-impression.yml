name: Close Android install banner after tap
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-menu-open-impression.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Close compact Android banner on Install
        shell: python
        run: |
          from pathlib import Path

          p = Path('assets/js/phone-landscape-hero.js')
          s = p.read_text(encoding='utf-8')

          old = 'banner.querySelector(".stat-android-auto-close")?.addEventListener("click",()=>banner.remove());\n  return banner;'
          new = 'banner.querySelector(".stat-android-auto-close")?.addEventListener("click",()=>banner.remove());\n  banner.querySelector(".stat-android-auto-install")?.addEventListener("click",()=>{\n    banner.classList.remove("is-visible");\n    window.setTimeout(()=>banner.remove(),180);\n  });\n  return banner;'

          if new not in s:
              if old not in s:
                  raise SystemExit('Android auto banner listener anchor not found')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189823+github-actions[bot]@users.noreply.github.com"
          git add assets/js/phone-landscape-hero.js
          git diff --cached --quiet || git commit -m "Close Android install banner after tap"
          git push origin HEAD:main
