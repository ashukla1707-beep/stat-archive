name: Unify download and offline status style

on:
  push:
    paths:
      - '.github/workflows/unify-download-offline-style.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unify status styling and refresh runtime cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('assets/js/action-spacing-fix.js')
          s=p.read_text()
          s=s.replace("const PURGE_KEY = 'statArchiveCardUiCachePurge20260915DownloadStatus';", "const PURGE_KEY = 'statArchiveCardUiCachePurge20260915UnifiedStatusV2';")
          marker='@media (hover:none),(pointer:coarse)'
          css='''\n/* Download and Offline share one visual state system. Keep transfer text/progress functional; only presentation is unified. */\nhtml body .card .card-actions .dl-btn.is-downloading,html body .card .card-actions .offline-btn:disabled:not(.is-saved){opacity:1!important}\nhtml body:not([data-theme="light"]) .card .card-actions .dl-btn.is-downloading,html body:not([data-theme="light"]) .card .card-actions .offline-btn:disabled:not(.is-saved){color:#f1f4f8!important;background:#111722!important;border:1px solid rgba(255,255,255,.035)!important;box-shadow:none!important}\nhtml body[data-theme="light"] .card .card-actions .dl-btn.is-downloading,html body[data-theme="light"] .card .card-actions .offline-btn:disabled:not(.is-saved){color:#27302d!important;background:#eee9f4!important;border:1px solid #ddd4e4!important;box-shadow:none!important}\nhtml body:not([data-theme="light"]) .card .card-actions .dl-btn.is-downloaded,html body:not([data-theme="light"]) .card .card-actions .offline-btn.is-saved{color:#63efff!important;background:rgba(18,52,64,.76)!important;border:1px solid rgba(99,239,255,.38)!important;box-shadow:inset 0 0 0 1px rgba(99,239,255,.07)!important;opacity:1!important}\nhtml body[data-theme="light"] .card .card-actions .dl-btn.is-downloaded,html body[data-theme="light"] .card .card-actions .offline-btn.is-saved{color:#fff!important;background:#5a3a73!important;border:1px solid #5a3a73!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)!important;opacity:1!important}\n'''
          if 'Download and Offline share one visual state system' not in s:
              s=s.replace(marker, css+marker)
          p.write_text(s)

          sw=Path('sw.js')
          w=sw.read_text()
          w=w.replace('stat-archive-shell-v20260915-web-progress-v2','stat-archive-shell-v20260915-unified-status-v3')
          w=w.replace('action-spacing-fix.js?v=20260915-download-status-v1','action-spacing-fix.js?v=20260915-unified-status-v3')
          w=w.replace('download-fix.js?v=20260915-download-status-v1','download-fix.js?v=20260915-unified-status-v3')
          # mobile-card-actions contains the canonical shared button theme; make it network-first too.
          needle="url.pathname.endsWith('/assets/js/action-spacing-fix.js') ||"
          repl=needle+"\n    url.pathname.endsWith('/assets/js/mobile-card-actions.js') ||"
          if "url.pathname.endsWith('/assets/js/mobile-card-actions.js') ||" not in w:
              w=w.replace(needle,repl)
          sw.write_text(w)
          PY
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/js/action-spacing-fix.js sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Unify Download and Offline status styling"
          git push
